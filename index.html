        function TeacherDomainView({ sources, setSources, showToast }) {
            const [form, setForm] = useState({ domain: "", org: "" });

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!form.domain || !form.org) return;
                const newSource = { id: crypto.randomUUID(), ...form, active: true };
                const updated = [newSource, ...sources];
                setSources(updated);
                await storeSet("trustedSources", updated);
                setForm({ domain: "", org: "" });
                showToast("Domain rujukan berhasil ditambahkan.");
            };

            const toggleStatus = async (id) => {
                const updated = sources.map(s => s.id === id ? { ...s, active: !s.active } : s);
                setSources(updated);
                await storeSet("trustedSources", updated);
            };

            const removeSource = async (id) => {
                const updated = sources.filter(s => s.id !== id);
                setSources(updated);
                await storeSet("trustedSources", updated);
                showToast("Domain dihapus.");
            };

            return (
                <div className="p-6 md:p-8 max-w-4xl mx-auto space-y-6">
                    <div>
                        <h2 className="font-display text-3xl font-bold text-gray-800">Domain Rujukan (Tingkat 2)</h2>
                        <p className="text-sm text-gray-500 mt-1">Kelola sumber website eksternal yang diizinkan untuk diakses AI ketika Modul Guru tidak mencukupi.</p>
                    </div>

                    <Card className="border-l-4 border-emerald-700">
                        <form onSubmit={handleAdd} className="flex flex-col sm:flex-row gap-3">
                            <input required value={form.domain} onChange={e=>setForm({...form, domain: e.target.value})} placeholder="Contoh: kemdikbud.go.id" className="flex-1 border rounded-lg px-3 py-2 text-sm text-gray-800"/>
                            <input required value={form.org} onChange={e=>setForm({...form, org: e.target.value})} placeholder="Organisasi" className="flex-1 border rounded-lg px-3 py-2 text-sm text-gray-800"/>
                            <button type="submit" className="px-5 py-2 bg-emerald-800 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-emerald-700">Tambah</button>
                        </form>
                    </Card>

                    <div className="space-y-3">
                        {sources.map(s => (
                            <Card key={s.id} className="py-4">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <Globe size={20} className={s.active ? "text-emerald-600" : "text-gray-400"} />
                                        <div>
                                            <p className="text-sm font-bold text-gray-800">{s.org}</p>
                                            <p className="text-xs text-gray-500">{s.domain}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => toggleStatus(s.id)} className={`px-3 py-1 rounded-full text-xs font-bold ${s.active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                                            {s.active ? 'Aktif' : 'Nonaktif'}
                                        </button>
                                        <button onClick={() => removeSource(s.id)} className="text-gray-400 hover:text-red-600"><Trash2 size={16}/></button>
                                    </div>
                                </div>
                            </Card>
                        ))}
                    </div>
                </div>
            );
        }

        function FilosofiView() {
            const principles = [
                { icon: "📖", title: "READ", desc: "Membaca sumber sebelum menerima jawaban." },
                { icon: "💡", title: "UNDERSTAND", desc: "Memahami informasi yang disajikan." },
                { icon: "🧠", title: "THINK", desc: "Memikirkan dan menganalisis lebih dalam." },
                { icon: "🔍", title: "VERIFY", desc: "Memeriksa kebenaran melalui sumber otentik." },
                { icon: "🌱", title: "REFLECT", desc: "Merefleksikan apa yang telah dipelajari untuk diamalkan." },
            ];
            return (
                <div className="p-6 md:p-8 max-w-4xl mx-auto space-y-6">
                    <div>
                        <h2 className="font-display text-3xl font-bold text-gray-800">Filosofi IQRA'</h2>
                        <p className="text-sm text-gray-500 mt-1">Landasan fundamental dalam merancang interaksi AI untuk pendidikan Islam.</p>
                    </div>
                    <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {principles.map(p => (
                            <Card key={p.title} className="text-center py-6">
                                <div className="text-3xl mb-3">{p.icon}</div>
                                <h3 className="font-display font-bold text-emerald-800 mb-2">{p.title}</h3>
                                <p className="text-xs text-gray-600 leading-relaxed">{p.desc}</p>
                            </Card>
                        ))}
                    </div>
                </div>
            );
        }

        const NAVIGATION_CONFIG = {
            student: [
                { id: "dashboard", label: "Beranda", icon: Home },
                { id: "ask", label: "Ask IQRA'", icon: Brain },
                { id: "materiku", label: "Perpustakaan", icon: BookOpen },
                { id: "uji", label: "Tugas (LMS)", icon: ClipboardEdit },
                { id: "riwayat", label: "Riwayat", icon: History },
                { id: "ayat", label: "Referensi Ayat", icon: BookMarked },
            ],
            teacher: [
                { id: "overview", label: "Wawasan Kelas", icon: BarChart3 },
                { id: "modul", label: "Kelola Modul AI", icon: Upload },
                { id: "tugas", label: "Kelola Tugas LMS", icon: ClipboardCheck },
                { id: "domain", label: "Domain Rujukan", icon: Globe },
                { id: "filosofi", label: "Filosofi", icon: Info },
                { id: "settings", label: "Pengaturan Sistem", icon: Settings },
            ]
        };

        function App() {
            const [ready, setReady] = useState(false);
            const [profile, setProfile] = useState({ role: "student", name: "Siswa Kelas 5", grade: 5 });
            const [view, setView] = useState("dashboard");
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [roleModalOpen, setRoleModalOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState(null);
            
            const [lmsAuthenticated, setLmsAuthenticated] = useState(false);
            const [showLmsModal, setShowLmsModal] = useState(false);

            const [documents, setDocuments] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [submissions, setSubmissions] = useState([]);
            const [history, setHistory] = useState([]);
            const [topicFreq, setTopicFreq] = useState({});
            const [trustedSources, setTrustedSources] = useState([
                { id: "ts-1", domain: "kemdikdasmen.go.id", org: "Kemdikdasmen RI", active: true },
                { id: "ts-2", domain: "quran.kemenag.go.id", org: "Al-Qur'an Kemenag RI", active: true }
            ]);

            const showToast = useCallback((msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 3000); }, []);

            useEffect(() => {
                (async () => {
                    const [p, h, d, a, s, tf, ts] = await Promise.all([
                        storeGet("user-profile", null), storeGet("history", []), storeGet("documents", BASE_CORPUS),
                        storeGet("assignments", BASE_ASSIGNMENTS), storeGet("submissions", []), storeGet("topicFreq", {}), storeGet("trustedSources", null)
                    ]);
                    if (p) { setProfile(p); setView(p.role === "student" ? "dashboard" : "overview"); }
                    setHistory(h); setDocuments(d); setAssignments(a); setSubmissions(s); setTopicFreq(tf);
                    if (ts) setTrustedSources(ts);
                    setReady(true);
                })();
            }, []);

            const handleNavClick = (id) => {
                if (profile.role === "student" && id === "uji" && !lmsAuthenticated) {
                    setShowLmsModal(true);
                    setSidebarOpen(false);
                    return;
                }
                setView(id); 
                setSidebarOpen(false); 
            };
            
            const handleRoleChange = async (newProf) => {
                setProfile(newProf); await storeSet("user-profile", newProf);
                setView(newProf.role === "student" ? "dashboard" : "overview");
                setLmsAuthenticated(false);
                setRoleModalOpen(false); setSidebarOpen(false); showToast(`Berhasil masuk sebagai ${newProf.role === "student" ? "Siswa" : "Guru"}`);
            };

            const handleLmsAuthSuccess = () => {
                setLmsAuthenticated(true);
                setShowLmsModal(false);
                setView("uji");
                showToast("Akses LMS dibuka.");
            };

            const handleNewExchange = async ({ question, subject, data, teacherDocs }) => {
                const entry = { question, subject, data, ts: Date.now() };
                const newHist = [...history, entry]; setHistory(newHist); storeSet("history", newHist);
                const topic = teacherDocs[0]?.chapter || subject;
                const newFreq = { ...topicFreq, [topic]: (topicFreq[topic] || 0) + 1 };
                setTopicFreq(newFreq); storeSet("topicFreq", newFreq);
            };

            if (!ready) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><Loader2 className="animate-spin text-emerald-700" size={32}/></div>;

            const currentNav = NAVIGATION_CONFIG[profile.role];

            const renderActiveView = () => {
                if (profile.role === "student") {
                    switch (view) {
                        case "dashboard": return <StudentDashboardView profile={profile} history={history} setView={handleNavClick} />;
                        case "ask": return <AskIqraView profile={profile} documents={documents} onNewExchange={handleNewExchange} showToast={showToast} />;
                        case "materiku": return <MaterikuView profile={profile} documents={documents} />;
                        case "ayat": return <AyatRelevan />;
                        case "uji": return <UjiPemahamanView profile={profile} assignments={assignments} submissions={submissions} setSubmissions={setSubmissions} showToast={showToast} />;
                        case "riwayat": return <RiwayatView history={history} />;
                        default: return <StudentDashboardView profile={profile} history={history} setView={handleNavClick} />;
                    }
                } else {
                    switch (view) {
                        case "overview": return <TeacherDashboardView documents={documents} topicFreq={topicFreq} />;
                        case "modul": return <TeacherModulView documents={documents} setDocuments={setDocuments} profile={profile} showToast={showToast} />;
                        case "tugas": return <TeacherTugasView assignments={assignments} setAssignments={setAssignments} submissions={submissions} showToast={showToast} />;
                        case "domain": return <TeacherDomainView sources={trustedSources} setSources={setTrustedSources} showToast={showToast} />;
                        case "filosofi": return <FilosofiView />;
                        case "settings": return <SystemSettingsView showToast={showToast} />;
                        default: return <TeacherModulView documents={documents} setDocuments={setDocuments} profile={profile} showToast={showToast} />;
                    }
                }
            };

            return (
                <div className="h-screen flex flex-col font-body text-[#17332D]" style={{ background: C.bg }}>
                    <FontsAndStyles />
                    <Toast message={toastMsg} onClose={() => setToastMsg(null)} />

                    <header className="shrink-0 z-30 flex items-center justify-between px-4 py-3 bg-white border-b border-gray-200 shadow-sm relative">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setSidebarOpen(true)} className="p-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors text-gray-700">
                                <Menu size={20} />
                            </button>
                            <div className="flex items-center gap-2 text-emerald-800 font-display font-bold text-lg cursor-pointer" onClick={() => handleNavClick(profile.role === 'student' ? 'dashboard' : 'overview')}>
                                <Brain size={22} /> IQRA' AI
                            </div>
                        </div>
                        <div className="flex items-center gap-2 px-3 py-1.5 bg-emerald-50 rounded-full border border-emerald-100">
                            <span className="text-xs font-bold text-emerald-800 truncate max-w-[100px] sm:max-w-none">{profile.name}</span>
                            <span className="text-[10px] uppercase font-bold text-emerald-600 bg-white px-2 py-0.5 rounded-full border border-emerald-100 hidden sm:inline-block">
                                {profile.role === "student" ? `KLS ${profile.grade}` : "Guru"}
                            </span>
                        </div>
                    </header>

                    {sidebarOpen && (
                        <div className="fixed inset-0 z-[60] flex">
                            <div className="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onClick={() => setSidebarOpen(false)}></div>
                            <aside className="relative w-72 max-w-[80vw] h-full bg-white shadow-2xl flex flex-col animate-slide-right">
                                <div className="p-5 border-b border-gray-100 flex items-center justify-between bg-white text-gray-800">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-lg flex items-center justify-center bg-gray-100">
                                            <Menu size={18} className="text-gray-600" />
                                        </div>
                                        <div>
                                            <span className="font-display font-bold tracking-wide block">Navigasi {profile.role === 'student' ? 'Siswa' : 'Guru'}</span>
                                            <span className="text-[10px] text-gray-500 block">Akses: {profile.name}</span>
                                        </div>
                                    </div>
                                    <button onClick={() => setSidebarOpen(false)} className="p-1.5 hover:bg-gray-100 rounded-lg transition-colors">
                                        <X size={18} className="text-gray-500"/>
                                    </button>
                                </div>
                                
                                <nav className="flex-1 p-4 space-y-2 overflow-y-auto bg-white">
                                    {currentNav.map(n => (
                                        <button key={n.id} onClick={() => handleNavClick(n.id)} className="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold text-left transition-all hover:bg-emerald-50 hover:text-emerald-800" style={{ background: view === n.id ? C.emeraldBg : "transparent", color: view === n.id ? C.emerald : C.inkSoft }}>
                                            <n.icon size={18} style={{ color: view === n.id ? C.emerald : C.inkFaint }}/> <span>{n.label}</span>
                                        </button>
                                    ))}
                                </nav>
                                
                                <div className="p-5 border-t border-gray-100 bg-white">
                                    <button onClick={() => { setRoleModalOpen(true); setSidebarOpen(false); }} className="w-full py-3 bg-white border border-gray-200 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-50 flex items-center justify-center gap-2 transition-all">
                                        <LogOut size={16}/> Ganti Akses
                                    </button>
                                </div>
                            </aside>
                        </div>
                    )}

                    {roleModalOpen && <RoleSwitchModal current={profile} onSelect={handleRoleChange} onClose={() => setRoleModalOpen(false)} />}
                    {showLmsModal && <LmsAuthModal onAuthenticate={handleLmsAuthSuccess} onClose={() => setShowLmsModal(false)} />}

                    <main className={`flex-1 relative w-full h-full ${view === "ask" ? "overflow-hidden" : "overflow-y-auto iqra-scroll"}`}>
                        {view !== "ask" && <div className="fixed -right-20 -bottom-20 pointer-events-none opacity-[0.03] z-0"><ArchitecturalMotif size={650} color={C.emerald} opacity={1} /></div>}
                        <div className="relative z-10 w-full h-full">{renderActiveView()}</div>
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
