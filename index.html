<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IQRA' AI - Modern Islamic EdTech</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.477.0?external=react"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as Lucide from 'lucide-react';

    const C = {
      bg: "#F8F7F2", surface: "#FFFFFF", ink: "#17332D", inkSoft: "#64736E", inkFaint: "#9CA8A3",
      emerald: "#0F5C4D", emeraldSecondary: "#177E6A", emeraldBg: "#DDF3ED",
      gold: "#D9A441", goldBg: "#F8EAC5",
      border: "#E5E9E7", borderSoft: "#F0F3F1",
      green: "#2E8B68", greenBg: "#E3F2EB",
      yellow: "#C58A25", yellowBg: "#FDF5E3",
      red: "#C95B54", redBg: "#FBEAE9",
    };

    function FontsAndStyles() {
      return (
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Amiri:wght@400;700&display=swap');
          .font-display { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.01em; }
          .font-body { font-family: 'Inter', -apple-system, sans-serif; }
          .font-arabic { font-family: 'Amiri', serif; line-height: 2.2; }
          * { box-sizing: border-box; }
          body { background-color: ${C.bg}; color: ${C.ink}; margin: 0; -webkit-tap-highlight-color: transparent; }
          .iqra-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
          .iqra-scroll::-webkit-scrollbar-thumb { background: #D0D5D3; border-radius: 10px; }
          @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
          input, textarea, select { font-family: inherit; }
          input:focus, textarea:focus, select:focus { outline: none; border-color: ${C.emerald}; box-shadow: 0 0 0 3px ${C.emeraldBg}; }
        `}</style>
      );
    }

    const STRENGTH_META = {
      green: { label: "Tervalidasi", sub: "Materi Guru", color: "#2E8B68", bg: "#E3F2EB" },
      yellow: { label: "Terpercaya", sub: "Pendidikan Resmi", color: "#C58A25", bg: "#FDF5E3" },
      orange: { label: "Informasi Terbatas", sub: "Referensi Umum", color: "#D9A441", bg: "#F8EAC5" },
      red: { label: "Perlu Cek", sub: "Pengetahuan AI", color: "#C95B54", bg: "#FBEAE9" },
    };

    const MODES = [
      { id: "jelaskan", label: "Jelaskan", icon: "Sparkles", desc: "Penjelasan terstruktur langsung ke inti materi." },
      { id: "detektif", label: "Detektif Ilmu", icon: "Search", desc: "AI tidak memberi jawaban langsung, melainkan petunjuk agar nalar siswa bekerja." },
      { id: "aha", label: "AHA", icon: "Lightbulb", desc: "Strategi penemuan pola, analogi unik, dan pemecahan masalah tingkat tinggi (HOTS)." },
      { id: "buku", label: "Buku Teks", icon: "BookMarked", desc: "Rujukan mutlak pada modul guru. Akan menolak menjawab jika materi tidak ada di buku." }
    ];

    const DEFAULT_SETTINGS = {
      studentPassword: "belajar",
      lmsPassword: "belajar",
      geminiApiKey: "", 
      philosophies: [
        { icon: "📖", title: "READ", desc: "Membaca sumber literatur sebelum menerima jawaban." },
        { icon: "💡", title: "UNDERSTAND", desc: "Memahami informasi dan konteks secara mendalam." },
        { icon: "🧠", title: "THINK", desc: "Memikirkan masalah dengan nalar kritis." },
        { icon: "🔍", title: "VERIFY", desc: "Memeriksa kebenaran fakta menghindari misinformasi." },
        { icon: "🌱", title: "REFLECT", desc: "Merefleksikan apa yang telah dipelajari." }
      ]
    };

    async function storeGet(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch (e) { return defaultVal; }
    }
    async function storeSet(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    function Card({ children, className = "", style = {} }) {
      return (
        <div className={`bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-gray-100 ${className}`} style={style}>
          {children}
        </div>
      );
    }

    // --- INTEGRASI GOOGLE GEMINI API (VIA LOCAL STORAGE) ---
    async function askIqraAI({ question, mode, grade, subject, teacherDocs }) {
      const settingsStr = localStorage.getItem("iqra-settings");
      const settings = settingsStr ? JSON.parse(settingsStr) : DEFAULT_SETTINGS;
      const apiKey = settings.geminiApiKey;

      if (!apiKey) {
        return {
          shortAnswer: "API Key Gemini belum dikonfigurasi.",
          explanation: "Sistem membutuhkan kunci akses AI untuk beroperasi. Mohon Bapak/Ibu Guru memasukkan API Key di menu 'Pengaturan Sistem' (Dasbor Guru).",
          thinkPrompt: null,
          sources: [],
          sourceStrength: "red",
          note: "Kunci akses AI tidak ditemukan."
        };
      }

      let contextText = "Tidak ada materi rujukan spesifik. Gunakan kurikulum SD standar Indonesia.";
      if (teacherDocs && teacherDocs.length > 0) {
        contextText = teacherDocs.map(d => `[Modul: ${d.title}, Bab: ${d.chapter}]\nIsi:\n${d.content}`).join("\n\n");
      }

      const prompt = `
Kamu adalah IQRA' AI, asisten guru untuk siswa SD Kelas ${grade} pada mata pelajaran ${subject}.

Materi Referensi Guru saat ini:
${contextText}

Pertanyaan Siswa: "${question}"
Mode Belajar: "${mode}"
- jelaskan: Jawaban langsung, mudah dipahami.
- detektif: Jangan beri jawaban penuh. Berikan 1 petunjuk awal, lalu berikan "thinkPrompt" untuk nalar.
- aha: Gunakan analogi unik atau pemecahan pola logis (HOTS).
- buku: Jawab HANYA berdasarkan "Materi Referensi Guru". Jika tidak ada, tolak dengan halus.

ATURAN MUTLAK:
Kembalikan balasan HANYA dalam format JSON (TANPA MARKDOWN, TANPA BACKTICKS):
{
  "shortAnswer": "Kesimpulan singkat 1-2 kalimat",
  "explanation": "Penjelasan detail sesuai mode",
  "thinkPrompt": "Pertanyaan pancingan (wajib ada untuk detektif & aha, isi null jika tidak perlu)",
  "sourceStrength": "green" (jika dari referensi guru), "yellow" (jika aman/umum), atau "red" (di luar topik)
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.3 } 
          })
        });

        if (!response.ok) throw new Error("Gagal terhubung ke Google Gemini");

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        
        rawText = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(rawText);

        return {
          shortAnswer: parsed.shortAnswer || "Gagal merangkum jawaban.",
          explanation: parsed.explanation || "",
          thinkPrompt: parsed.thinkPrompt || null,
          sources: teacherDocs.length ? [{ icon: "📘", label: teacherDocs[0].title, detail: `Bab: ${teacherDocs[0].chapter}` }] : [],
          sourceStrength: parsed.sourceStrength || (teacherDocs.length ? "green" : "yellow"),
          note: teacherDocs.length ? null : "Jawaban dihasilkan dari basis data AI umum."
        };
      } catch (error) {
        console.error("Gemini Error:", error);
        return {
          shortAnswer: "IQRA' AI mengalami kendala pemrosesan.",
          explanation: "Terjadi kesalahan koneksi atau format data. Pastikan API Key valid.",
          thinkPrompt: null,
          sources: [],
          sourceStrength: "red",
          note: "Gagal berkomunikasi dengan server AI."
        };
      }
    }

    // --- STUDENT VIEWS ---
    function AskIqraView({ profile, documents, onNewExchange }) {
      const [mode, setMode] = useState("jelaskan");
      const [subject, setSubject] = useState("IPAS");
      const [input, setInput] = useState("");
      const [messages, setMessages] = useState([]);
      const [loading, setLoading] = useState(false);
      const [showHelp, setShowHelp] = useState(false);
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages, loading]);

      const handleSend = async () => {
        if (!input.trim() || loading) return;
        const q = input.trim();
        setInput("");
        setMessages(prev => [...prev, { id: Date.now().toString(), role: "user", text: q }]);
        setLoading(true);

        try {
          const docs = documents.filter(d => d.subject === subject);
          const res = await askIqraAI({ question: q, mode, grade: profile.grade, subject, teacherDocs: docs });
          
          setMessages(prev => [...prev, { id: Date.now().toString(), role: "ai", data: res, question: q, subject }]);
          if (onNewExchange) onNewExchange({ question: q, subject, data: res });
        } catch (e) {
          setMessages(prev => [...prev, { id: Date.now().toString(), role: "error", text: "Terjadi kesalahan sistem." }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex flex-col h-full bg-gray-50/50">
          <div className="bg-white border-b border-gray-100 p-4 shrink-0 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-2">
              {MODES.map(m => {
                const IconComp = Lucide[m.icon];
                const active = mode === m.id;
                return (
                  <button key={m.id} onClick={() => setMode(m.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${active ? 'bg-[#0F5C4D] text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-50'}`}>
                    {IconComp && <IconComp size={14} />} {m.label}
                  </button>
                );
              })}
              <button onClick={() => setShowHelp(true)} className="p-1.5 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100"><Lucide.HelpCircle size={16}/></button>
            </div>
            <select value={subject} onChange={e => setSubject(e.target.value)} className="bg-white border border-gray-200 text-sm font-semibold rounded-lg px-3 py-2 text-[#17332D]">
              {["IPAS", "Matematika", "Bahasa Indonesia", "Pendidikan Agama Islam"].map(s => <option key={s}>{s}</option>)}
            </select>
          </div>

          <div ref={scrollRef} className="flex-1 overflow-y-auto iqra-scroll p-4 md:p-8 space-y-6">
            {messages.length === 0 && (
              <div className="flex flex-col items-center justify-center h-full text-center max-w-md mx-auto opacity-60">
                <Lucide.Brain size={48} className="text-[#0F5C4D] mb-4"/>
                <h3 className="font-display text-xl font-bold text-[#17332D]">Assalamu'alaikum, Siswa Kelas {profile.grade}</h3>
                <p className="text-sm text-gray-500 mt-2">Tanyakan materi {subject} yang belum kamu pahami. Pilih mode belajar di atas sesuai kebutuhanmu.</p>
              </div>
            )}
            {messages.map((m) => {
              if (m.role === "user") {
                return (
                  <div key={m.id} className="flex justify-end animate-slide-up">
                    <div className="bg-[#E3F2EB] text-[#0F5C4D] px-5 py-3 rounded-2xl rounded-tr-sm max-w-[85%] text-sm font-medium shadow-sm">
                      {m.text}
                    </div>
                  </div>
                );
              }
              if (m.role === "error") {
                return <div key={m.id} className="text-center text-xs text-red-500 bg-red-50 p-2 rounded-lg">{m.text}</div>;
              }
              
              const mData = m.data;
              const strengthMeta = STRENGTH_META[mData.sourceStrength] || STRENGTH_META.orange;

              return (
                <div key={m.id} className="flex justify-start animate-slide-up">
                  <div className="bg-white border border-gray-100 p-5 rounded-2xl rounded-tl-sm max-w-[95%] md:max-w-[85%] shadow-sm">
                    <p className="text-sm font-semibold text-[#17332D] leading-relaxed mb-3">{mData.shortAnswer}</p>
                    {mData.explanation && <p className="text-sm text-[#64736E] leading-relaxed mb-4">{mData.explanation}</p>}
                    
                    {mData.thinkPrompt && (
                      <div className="bg-[#F8EAC5] border border-[#F2DFB3] p-4 rounded-xl flex gap-3 mb-4">
                        <Lucide.Brain size={18} className="text-[#D9A441] shrink-0 mt-0.5"/>
                        <p className="text-sm font-semibold text-[#906D2A]">{mData.thinkPrompt}</p>
                      </div>
                    )}

                    <div className="bg-gray-50 border border-gray-100 rounded-xl overflow-hidden mt-2">
                      <div className="px-3 py-2 border-b border-gray-100 flex items-center justify-between">
                        <span className="text-[10px] font-bold uppercase tracking-widest text-gray-400">Status Referensi</span>
                        <div className="flex items-center gap-1 px-2 py-0.5 rounded" style={{ background: strengthMeta.bg, color: strengthMeta.color }}>
                          <Lucide.CheckCircle size={10} /> <span className="text-[10px] font-bold">{strengthMeta.label}</span>
                        </div>
                      </div>
                      {mData.sources && mData.sources.length > 0 ? (
                        <div className="p-3">
                          {mData.sources.map((s, i) => (
                            <div key={i} className="flex items-start gap-2">
                              <span className="text-sm mt-0.5">{s.icon}</span>
                              <div>
                                <p className="text-xs font-bold text-[#17332D]">{s.label}</p>
                                <p className="text-[10px] text-gray-500">{s.detail}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="p-3 text-xs text-gray-500 flex items-center gap-2">
                          <Lucide.AlertCircle size={14} className="text-yellow-500"/> {mData.note || "Berdasarkan pengetahuan umum AI."}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
            {loading && (
              <div className="flex justify-start animate-slide-up">
                <div className="bg-white px-5 py-4 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 flex items-center gap-3">
                  <div className="w-2 h-2 bg-[#0F5C4D] rounded-full animate-bounce"></div>
                  <div className="w-2 h-2 bg-[#0F5C4D] rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                  <div className="w-2 h-2 bg-[#0F5C4D] rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                  <span className="text-xs font-medium text-gray-400 ml-1">Menganalisis...</span>
                </div>
              </div>
            )}
          </div>

          <div className="p-4 bg-white border-t border-gray-100 shrink-0">
            <div className="max-w-4xl mx-auto relative flex items-center">
              <input 
                type="text" 
                value={input} 
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSend()}
                placeholder="Tanyakan materi pelajaran..."
                className="w-full bg-gray-50 border border-gray-200 text-sm rounded-full pl-5 pr-14 py-3.5 focus:border-[#0F5C4D] focus:bg-white transition-all shadow-sm"
              />
              <button 
                onClick={handleSend}
                disabled={loading || !input.trim()}
                className="absolute right-1.5 top-1.5 bottom-1.5 bg-[#0F5C4D] text-white w-10 flex items-center justify-center rounded-full disabled:opacity-50 hover:bg-[#177E6A] transition-colors"
              >
                <Lucide.Send size={16} className="ml-0.5" />
              </button>
            </div>
          </div>

          {showHelp && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#17332D]/40 backdrop-blur-sm animate-slide-up">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl relative">
                <button onClick={() => setShowHelp(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><Lucide.X size={20}/></button>
                <h3 className="font-display text-xl font-bold text-[#17332D] mb-4">Panduan Mode Belajar</h3>
                <div className="space-y-4">
                  {MODES.map(m => {
                    const IconC = Lucide[m.icon];
                    return (
                      <div key={m.id} className="flex gap-3">
                        <div className="w-8 h-8 rounded-lg bg-[#E3F2EB] flex items-center justify-center shrink-0 text-[#0F5C4D]">
                          {IconC && <IconC size={16} />}
                        </div>
                        <div>
                          <p className="text-sm font-bold text-[#17332D]">{m.label}</p>
                          <p className="text-xs text-gray-500 leading-relaxed mt-0.5">{m.desc}</p>
                        </div>
                      </div>
                    )
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- TEACHER VIEWS ---
    function SystemSettingsView({ settings, setSettings, showToast }) {
      const [localSet, setLocalSet] = useState(settings);

      const save = () => {
        setSettings(localSet);
        localStorage.setItem("iqra-settings", JSON.stringify(localSet));
        showToast("Pengaturan sistem berhasil diperbarui.");
      };

      return (
        <div className="p-6 md:p-10 max-w-4xl mx-auto pb-24">
          <div className="mb-8">
            <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Pengaturan Sistem</h2>
            <p className="text-sm mt-1 text-[#64736E]">Kelola keamanan dan integrasi kecerdasan buatan.</p>
          </div>

          <Card className="mb-8 border-t-4 border-t-[#0F5C4D]">
            <h3 className="text-base font-bold mb-5 flex items-center gap-2 text-[#17332D]">
              <Lucide.Brain size={18} className="text-[#0F5C4D]"/> Kecerdasan Buatan (Google Gemini)
            </h3>
            <div>
              <label className="text-xs font-bold mb-2 block uppercase tracking-wide text-[#64736E]">API Key Gemini 1.5 Flash</label>
              <input 
                type="password"
                value={localSet.geminiApiKey || ""} 
                onChange={e => setLocalSet({...localSet, geminiApiKey: e.target.value})} 
                placeholder="Paste API Key Anda di sini (AIzaSy...)" 
                className="w-full border-2 rounded-xl px-4 py-3 text-sm font-medium outline-none transition-colors border-[#E5E9E7] focus:border-[#0F5C4D]" 
              />
              <p className="text-xs mt-2 text-[#9CA8A3]">Dapatkan API Key gratis Anda di <a href="https://aistudio.google.com/app/apikey" target="_blank" className="underline font-bold text-[#0F5C4D]">Google AI Studio</a>. Kunci ini hanya disimpan di memori browser perangkat ini.</p>
            </div>
          </Card>

          <Card className="mb-8 border-t-4 border-t-[#0F5C4D]">
            <h3 className="text-base font-bold mb-5 flex items-center gap-2 text-[#17332D]">
              <Lucide.Key size={18} className="text-[#0F5C4D]"/> Kunci Keamanan Akses
            </h3>
            <div className="grid sm:grid-cols-2 gap-6">
              <div>
                <label className="text-xs font-bold mb-2 block uppercase tracking-wide text-[#64736E]">Sandi Login Portal Siswa</label>
                <input value={localSet.studentPassword} onChange={e=>setLocalSet({...localSet, studentPassword: e.target.value})} className="w-full border-2 rounded-xl px-4 py-3 text-sm border-[#E5E9E7] focus:border-[#0F5C4D]" />
              </div>
            </div>
          </Card>

          <div className="flex justify-end">
            <button onClick={save} className="bg-[#0F5C4D] text-white font-bold py-3.5 px-8 rounded-xl text-sm shadow-lg hover:bg-[#177E6A] transition-all flex items-center gap-2">
              <Lucide.Save size={16}/> Simpan Pembaruan
            </button>
          </div>
        </div>
      );
    }

    // --- MAIN APP SHELL ---
    const NAV = {
      student: [
        { id: "ask", label: "Sesi Diskusi", icon: "Brain" },
      ],
      teacher: [
        { id: "settings", label: "Pengaturan Sistem", icon: "Settings" }
      ]
    };

    function App() {
      const [profile, setProfile] = useState(null); 
      const [view, setView] = useState("ask");
      const [isMobileNavOpen, setIsMobileNavOpen] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(true);
      const [loginRole, setLoginRole] = useState("student"); // student | teacher
      
      const [loginInput, setLoginInput] = useState({ grade: 5, password: "" });
      
      const [documents, setDocuments] = useState([]);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);

      useEffect(() => {
        const init = async () => {
          const sSets = await storeGet("iqra-settings", DEFAULT_SETTINGS);
          setSettings(sSets);
          
          const sProf = await storeGet("iqra-profile", null);
          if (sProf) {
            setProfile(sProf);
            setView(sProf.role === "teacher" ? "settings" : "ask");
            setShowLoginModal(false);
          }
        };
        init();
      }, []);

      const handleLogin = () => {
        if (loginRole === "student") {
          if (loginInput.password === settings.studentPassword) {
            const p = { role: "student", grade: loginInput.grade };
            setProfile(p);
            storeSet("iqra-profile", p);
            setView("ask");
            setShowLoginModal(false);
          } else {
            alert("Sandi akses siswa salah!");
          }
        } else {
          if (loginInput.password === "bismillah") {
            const p = { role: "teacher", name: "Bapak/Ibu Guru" };
            setProfile(p);
            storeSet("iqra-profile", p);
            setView("settings");
            setShowLoginModal(false);
          } else {
            alert("Sandi keamanan guru salah!");
          }
        }
      };

      const handleLogout = () => {
        setProfile(null);
        storeSet("iqra-profile", null);
        setLoginInput({ grade: 5, password: "" });
        setLoginRole("student");
        setShowLoginModal(true);
      };

      if (showLoginModal) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#F8F7F2] p-4 font-body">
            <FontsAndStyles />
            <div className="w-full max-w-sm bg-white rounded-3xl p-8 shadow-xl animate-slide-up border border-gray-100">
              <div className="flex flex-col items-center mb-8">
                <div className="w-14 h-14 bg-[#0F5C4D] rounded-2xl flex items-center justify-center shadow-lg shadow-[#0F5C4D]/20 mb-4">
                  <Lucide.BookOpen size={28} color="#FFF" />
                </div>
                <h1 className="font-display text-2xl font-bold text-[#17332D]">IQRA' Portal</h1>
              </div>

              <div className="flex bg-gray-50 p-1 rounded-xl mb-6 border border-gray-100">
                <button onClick={() => setLoginRole("student")} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${loginRole === "student" ? "bg-white text-[#0F5C4D] shadow-sm" : "text-gray-400"}`}>Siswa</button>
                <button onClick={() => setLoginRole("teacher")} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${loginRole === "teacher" ? "bg-white text-[#0F5C4D] shadow-sm" : "text-gray-400"}`}>Guru</button>
              </div>

              {loginRole === "student" ? (
                <div className="space-y-4">
                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-widest text-gray-400 block mb-1">Tingkat Kelas</label>
                    <select value={loginInput.grade} onChange={e=>setLoginInput({...loginInput, grade: Number(e.target.value)})} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-[#0F5C4D]">
                      {[4,5,6].map(g => <option key={g} value={g}>Kelas {g} SD</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-widest text-gray-400 block mb-1">Sandi Akses</label>
                    <input type="password" value={loginInput.password} onChange={e=>setLoginInput({...loginInput, password: e.target.value})} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-[#0F5C4D]" />
                  </div>
                </div>
              ) : (
                <div>
                  <label className="text-[10px] font-bold uppercase tracking-widest text-gray-400 block mb-1">Sandi Keamanan (Guru)</label>
                  <input type="password" value={loginInput.password} onChange={e=>setLoginInput({...loginInput, password: e.target.value})} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-[#0F5C4D]" />
                </div>
              )}

              <button onClick={handleLogin} className="w-full bg-[#0F5C4D] text-white font-bold py-3.5 rounded-xl mt-8 shadow-lg shadow-[#0F5C4D]/20 hover:bg-[#177E6A] transition-all">
                Masuk
              </button>
            </div>
          </div>
        );
      }

      const navItems = NAV[profile.role] || [];

      return (
        <div className="h-screen flex font-body overflow-hidden bg-[#F8F7F2]">
          <FontsAndStyles />
          
          {/* Mobile Header */}
          <div className="md:hidden fixed top-0 left-0 right-0 h-14 bg-white border-b border-gray-100 flex items-center justify-between px-4 z-30">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 bg-[#0F5C4D] rounded-lg flex items-center justify-center">
                <Lucide.BookOpen size={16} color="#FFF"/>
              </div>
              <span className="font-display font-bold text-[#17332D]">IQRA'</span>
            </div>
            <button onClick={() => setIsMobileNavOpen(!isMobileNavOpen)} className="p-2 text-[#17332D]">
              {isMobileNavOpen ? <Lucide.X size={20}/> : <Lucide.Menu size={20}/>}
            </button>
          </div>

          {/* Sidebar Drawer */}
          <div className={`fixed inset-y-0 left-0 z-20 w-64 bg-white border-r border-gray-100 transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 ${isMobileNavOpen ? 'translate-x-0' : '-translate-x-full'} flex flex-col pt-14 md:pt-0`}>
            <div className="hidden md:flex items-center gap-3 px-6 py-8">
              <div className="w-10 h-10 bg-[#0F5C4D] rounded-xl flex items-center justify-center shadow-sm">
                <Lucide.BookOpen size={20} color="#FFF"/>
              </div>
              <span className="font-display text-xl font-bold text-[#17332D]">IQRA'</span>
            </div>
            
            <div className="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
              {navItems.map(n => {
                const IconC = Lucide[n.icon];
                const active = view === n.id;
                return (
                  <button key={n.id} onClick={() => { setView(n.id); setIsMobileNavOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${active ? 'bg-[#E3F2EB] text-[#0F5C4D]' : 'text-gray-500 hover:bg-gray-50'}`}>
                    {IconC && <IconC size={18} />} {n.label}
                  </button>
                )
              })}
            </div>

            <div className="p-4 border-t border-gray-100">
              <div className="bg-gray-50 rounded-xl p-3 mb-3 border border-gray-100">
                <p className="text-xs font-bold text-[#17332D]">{profile.role === 'teacher' ? 'Bapak/Ibu Guru' : `Siswa Kelas ${profile.grade}`}</p>
                <p className="text-[10px] text-gray-500 uppercase tracking-wider mt-0.5">{profile.role === 'teacher' ? 'Mode Pengelola' : 'Mode Pelajar'}</p>
              </div>
              <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 transition-colors">
                <Lucide.LogOut size={14}/> Keluar Aplikasi
              </button>
            </div>
          </div>

          {/* Main Content Area */}
          <div className="flex-1 relative h-full pt-14 md:pt-0 overflow-hidden">
            {profile.role === "student" && view === "ask" && (
              <AskIqraView profile={profile} documents={documents} />
            )}
            {profile.role === "teacher" && view === "settings" && (
              <div className="h-full overflow-y-auto iqra-scroll">
                <SystemSettingsView settings={settings} setSettings={setSettings} showToast={(msg) => alert(msg)} />
              </div>
            )}
          </div>

          {/* Mobile Overlay */}
          {isMobileNavOpen && (
            <div className="fixed inset-0 bg-[#17332D]/20 backdrop-blur-sm z-10 md:hidden" onClick={() => setIsMobileNavOpen(false)}></div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
