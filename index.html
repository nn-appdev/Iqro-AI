<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IQRA' AI - Modern Islamic EdTech</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel untuk kompilasi JSX langsung di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Import Map untuk React & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.477.0?external=react"
      }
    }
  </script>
</head>
<body class="bg-[#F8F7F2] text-[#17332D] antialiased overflow-hidden">
  <div id="root" class="h-screen w-screen"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as Lucide from 'lucide-react';

    /* ============================================================
       DESIGN TOKENS & KONFIGURASI
       ============================================================ */
    const C = {
      bg: "#F8F7F2", surface: "#FFFFFF", ink: "#17332D", inkSoft: "#64736E", inkFaint: "#9CA8A3",
      emerald: "#0F5C4D", emeraldSecondary: "#177E6A", emeraldBg: "#DDF3ED",
      gold: "#D9A441", goldBg: "#F8EAC5",
      border: "#E5E9E7", borderSoft: "#F0F3F1",
      green: "#2E8B68", greenBg: "#E3F2EB",
      yellow: "#C58A25", yellowBg: "#FDF5E3",
      orange: "#CC7A2E", orangeBg: "#FBEBDB",
      red: "#C95B54", redBg: "#FBEAE9",
    };

    const MODES = [
      { id: "jelaskan", label: "Jelaskan", icon: "Sparkles", desc: "Penjelasan terstruktur langsung ke inti permasalahan." },
      { id: "detektif", label: "Detektif Ilmu", icon: "Search", desc: "Bimbingan langkah demi langkah dengan pertanyaan pemantik." },
      { id: "aha", label: "AHA", icon: "Lightbulb", desc: "Strategi penemuan pola & pemecahan masalah tingkat lanjut." },
      { id: "buku", label: "Buku Teks", icon: "BookMarked", desc: "Rujukan ketat hanya berdasarkan materi dari guru kelas." },
    ];

    const SUBJECTS = ["Bahasa Indonesia", "Matematika", "IPAS", "Pendidikan Pancasila", "Pendidikan Agama Islam"];

    const DEFAULT_SETTINGS = {
      studentPassword: "belajar",
      lmsPassword: "belajar",
      philosophies: [
        { icon: "📖", title: "READ", desc: "Membaca dan mencari sumber literatur sebelum menerima jawaban." },
        { icon: "💡", title: "UNDERSTAND", desc: "Memahami informasi dan konteks yang disajikan secara mendalam." },
        { icon: "🧠", title: "THINK", desc: "Memikirkan dan menganalisis masalah dengan nalar kritis." },
        { icon: "🔍", title: "VERIFY", desc: "Memeriksa kebenaran fakta dan menghindari informasi keliru." },
        { icon: "🌱", title: "REFLECT", desc: "Merefleksikan apa yang telah dipelajari untuk pengembangan diri." }
      ]
    };

    const BASE_CORPUS = [
      { id: "doc-1", title: "Modul IPAS Kelas 5", subject: "IPAS", grade: 5, chapter: "Tumbuhan dan Lingkungannya", keywords: ["fotosintesis", "tumbuhan"], content: "Fotosintesis adalah proses biokimia tumbuhan mengubah energi cahaya menjadi makanan. Tumbuhan memerlukan air, karbon dioksida, dan cahaya matahari." },
      { id: "doc-2", title: "Modul PAI Kelas 5", subject: "Pendidikan Agama Islam", grade: 5, chapter: "Rukun Iman", keywords: ["iman", "rukun", "malaikat"], content: "Rukun iman ada 6, yaitu iman kepada Allah, Malaikat, Kitab, Rasul, Hari Kiamat, dan Qada & Qadar." }
    ];

    /* ============================================================
       HELPER COMPONENTS
       ============================================================ */
    function FontsAndStyles() {
      return (
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Amiri:wght@400;700&display=swap');
          .font-display { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.01em; }
          .font-body { font-family: 'Inter', -apple-system, sans-serif; }
          .font-arabic { font-family: 'Amiri', serif; line-height: 2.3; }
          * { box-sizing: border-box; }
          .iqra-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
          .iqra-scroll::-webkit-scrollbar-thumb { background: #D0D5D3; border-radius: 6px; }
          @keyframes riseIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
          .rise-in { animation: riseIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
          @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
          .slide-right { animation: slideRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
          button:active { transform: scale(0.98); }
          .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid ${C.border}; }
        `}</style>
      );
    }

    function GeoMotif({ size = 120, color = C.emerald, opacity = 0.04 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 100 100" style={{ opacity }} className="pointer-events-none select-none">
          <g fill="none" stroke={color} strokeWidth="1">
            <rect x="20" y="20" width="60" height="60" />
            <rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)" />
            <circle cx="50" cy="50" r="30" />
          </g>
        </svg>
      );
    }

    function Card({ children, className = "", style, onClick }) {
      return (
        <div onClick={onClick} className={`rounded-xl p-5 shadow-sm bg-white border border-[#E5E9E7] ${onClick ? 'cursor-pointer hover:shadow-md transition-shadow' : ''} ${className}`} style={style}>
          {children}
        </div>
      );
    }

    function Toast({ message }) {
      if (!message) return null;
      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] rise-in pointer-events-none">
          <div className="bg-[#17332D] text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-3 border border-[#64736E]">
            <Lucide.CheckCircle size={18} color="#D9A441" />
            {message}
          </div>
        </div>
      );
    }

    function StrengthBadge({ level }) {
      const META = {
        green: { label: "Tervalidasi", sub: "Materi Kelas", c: C.green, bg: C.greenBg },
        yellow: { label: "Terpercaya", sub: "Pengetahuan Edukasi", c: C.yellow, bg: C.yellowBg },
        orange: { label: "Info Terbatas", sub: "Pengetahuan Umum", c: C.orange, bg: C.orangeBg },
        red: { label: "Belum Ada Sumber", sub: "AI Umum", c: C.red, bg: C.redBg },
      };
      const m = META[level] || META.orange;
      return (
        <div className="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1" style={{ background: m.bg, color: m.c }}>
          <Lucide.CircleDot size={12} />
          <span className="text-xs font-bold">{m.label}</span>
          <span className="text-[10px] hidden sm:inline opacity-80">· {m.sub}</span>
        </div>
      );
    }

    /* ============================================================
       MODALS (LOGIN & LMS AUTH)
       ============================================================ */
    // Hanya untuk Siswa (Tanpa nama, hanya kelas & sandi)
    function StudentLoginModal({ onSelect, settings }) {
      const [password, setPassword] = useState("");
      const [grade, setGrade] = useState(5);
      const [error, setError] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        setError("");
        if (password !== settings.studentPassword) {
          setError(`Sandi Akses Siswa salah. (Clue: ${settings.studentPassword})`);
          return;
        }
        onSelect({ role: "student", name: `Siswa Kelas ${grade}`, grade: Number(grade) });
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#17332D]/50 backdrop-blur-sm">
          <div className="w-full max-w-sm rounded-2xl p-6 bg-white shadow-2xl rise-in relative">
            <div className="flex flex-col items-center justify-center mb-6">
              <div className="w-12 h-12 rounded-xl bg-[#DDF3ED] text-[#0F5C4D] flex items-center justify-center mb-3"><Lucide.GraduationCap size={28}/></div>
              <h3 className="font-display text-2xl font-bold text-[#17332D] text-center">Portal Akses IQRA'</h3>
              <p className="text-sm text-gray-500 font-medium text-center mt-1">Ruang Belajar Interaktif Siswa</p>
            </div>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="rise-in">
                <label className="text-xs font-bold text-gray-500 mb-1.5 block uppercase tracking-wide">Tingkat Kelas SD</label>
                <select value={grade} onChange={(e) => setGrade(e.target.value)} className="w-full rounded-xl px-4 py-3 text-sm font-medium outline-none border-2 border-gray-100 focus:border-[#0F5C4D] bg-gray-50">
                  <option value="4">Kelas 4 SD (Fase B)</option>
                  <option value="5">Kelas 5 SD (Fase C)</option>
                  <option value="6">Kelas 6 SD (Fase C)</option>
                </select>
              </div>

              <div className="rise-in">
                <label className="text-xs font-bold text-gray-500 mb-1.5 block uppercase tracking-wide">Sandi Akses</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Lucide.Key size={16} className="text-gray-400" /></div>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder={`Sandi (clue: ${settings.studentPassword})`} className="w-full rounded-xl pl-10 pr-4 py-3 text-sm font-medium outline-none border-2 border-gray-100 focus:border-[#0F5C4D] bg-gray-50" />
                </div>
              </div>

              {error && <div className="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold border border-red-100 flex gap-2"><Lucide.AlertTriangle size={16} className="shrink-0"/> {error}</div>}

              <button type="submit" className="w-full rounded-xl py-3.5 mt-2 text-sm font-bold text-white bg-[#0F5C4D] hover:bg-[#177E6A] shadow-md transition-all active:scale-95">Mulai Belajar</button>
            </form>
          </div>
        </div>
      );
    }

    // Untuk Guru/Admin dari sidebar
    function TeacherLoginModal({ onSelect, onClose }) {
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        setError("");
        if (password !== "bismillah") {
          setError("Sandi Keamanan salah. (Clue: bismillah)");
          return;
        }
        onSelect({ role: "teacher", name: "Pengajar / Admin", grade: 5 });
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#17332D]/50 backdrop-blur-sm">
          <div className="w-full max-w-sm rounded-2xl p-6 bg-white shadow-2xl rise-in relative">
            <button onClick={onClose} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-700 bg-gray-50 rounded-full transition-colors"><Lucide.X size={16} /></button>
            <div className="flex flex-col items-center justify-center mb-6 mt-2">
              <div className="w-12 h-12 rounded-xl bg-gray-100 text-gray-600 flex items-center justify-center mb-3"><Lucide.ShieldCheck size={28}/></div>
              <h3 className="font-display text-xl font-bold text-[#17332D] text-center">Otorisasi Guru / Admin</h3>
            </div>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-bold text-gray-500 mb-1.5 block uppercase tracking-wide">Sandi Keamanan</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Lucide.Lock size={16} className="text-gray-400" /></div>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Sandi (clue: bismillah)" className="w-full rounded-xl pl-10 pr-4 py-3 text-sm font-medium outline-none border-2 border-gray-100 focus:border-gray-500 bg-gray-50" autoFocus />
                </div>
              </div>
              {error && <div className="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold border border-red-100 flex gap-2"><Lucide.AlertTriangle size={16} className="shrink-0"/> {error}</div>}
              <button type="submit" className="w-full rounded-xl py-3.5 mt-2 text-sm font-bold text-white bg-[#17332D] hover:bg-[#2c4e46] shadow-md transition-all active:scale-95">Buka Panel Pengelola</button>
            </form>
          </div>
        </div>
      );
    }

    // Modal Sandi Ujian (LMS)
    function LmsAuthModal({ onSuccess, onClose, settings }) {
      const [pwd, setPwd] = useState("");
      const [err, setErr] = useState("");

      const submit = (e) => {
        e.preventDefault();
        if (pwd === settings.lmsPassword) onSuccess();
        else setErr(`Sandi Brankas salah. (Clue: ${settings.lmsPassword})`);
      };

      return (
        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-[#17332D]/40 backdrop-blur-sm">
          <div className="w-full max-w-sm rounded-2xl p-6 bg-white shadow-2xl rise-in relative">
            <button onClick={onClose} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 bg-gray-50 rounded-full"><Lucide.X size={16}/></button>
            <div className="flex justify-center mb-5"><div className="p-4 bg-yellow-100 rounded-full border-4 border-white shadow-sm"><Lucide.Lock size={28} color="#C58A25"/></div></div>
            <h3 className="font-display text-center text-2xl font-bold text-[#17332D] mb-2">Brankas LMS</h3>
            <p className="text-center text-sm text-gray-500 mb-6 font-medium">Masukkan sandi khusus dari guru untuk membuka kertas ujian.</p>
            
            <form onSubmit={submit} className="space-y-4">
              <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="Sandi Brankas..." autoFocus className="w-full rounded-xl px-4 py-3.5 text-base font-bold tracking-widest text-center border-2 border-gray-100 outline-none focus:border-[#0F5C4D] bg-gray-50" />
              {err && <p className="text-xs text-red-500 text-center font-bold bg-red-50 p-2 rounded-lg">{err}</p>}
              <button type="submit" className="w-full rounded-xl py-3.5 text-sm font-bold text-white bg-[#0F5C4D] hover:bg-[#177E6A] shadow-md transition-all active:scale-95">Buka Soal</button>
            </form>
          </div>
        </div>
      );
    }

    /* ============================================================
       TEACHER VIEWS
       ============================================================ */
    function TeacherOverview({ assignments, documents, history }) {
      const topTopics = ["Fotosintesis", "Rukun Iman", "Pecahan"];
      return (
        <div className="p-6 md:p-10 max-w-5xl mx-auto space-y-8 pb-24">
          <div>
            <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Tinjauan Kelas</h2>
            <p className="text-sm text-gray-500 font-medium mt-1">Pantau analitik keterlibatan siswa secara langsung.</p>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <Card className="border-l-4 border-[#0F5C4D]"><div className="flex justify-between items-start mb-2"><span className="text-xs font-bold text-gray-400 uppercase">Modul AI</span><Lucide.BookOpen size={16} color="#0F5C4D"/></div><h3 className="text-3xl font-display font-bold text-[#17332D]">{documents.length}</h3></Card>
            <Card className="border-l-4 border-[#D9A441]"><div className="flex justify-between items-start mb-2"><span className="text-xs font-bold text-gray-400 uppercase">Tugas LMS</span><Lucide.FileCheck size={16} color="#D9A441"/></div><h3 className="text-3xl font-display font-bold text-[#17332D]">{assignments.length}</h3></Card>
            <Card className="border-l-4 border-[#177E6A]"><div className="flex justify-between items-start mb-2"><span className="text-xs font-bold text-gray-400 uppercase">Sesi Tanya</span><Lucide.MessageCircle size={16} color="#177E6A"/></div><h3 className="text-3xl font-display font-bold text-[#17332D]">{history.length}</h3></Card>
            <Card className="border-l-4 border-[#C95B54]"><div className="flex justify-between items-start mb-2"><span className="text-xs font-bold text-gray-400 uppercase">Siswa Aktif</span><Lucide.Users size={16} color="#C95B54"/></div><h3 className="text-3xl font-display font-bold text-[#17332D]">{Math.min(history.length, 12)}</h3></Card>
          </div>
          <Card>
            <h3 className="text-sm font-bold text-[#17332D] mb-4 flex items-center gap-2"><Lucide.TrendingUp size={16} className="text-[#D9A441]"/> Topik Paling Banyak Ditanyakan</h3>
            <div className="space-y-3">
              {topTopics.map((t, i) => (
                <div key={t} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                  <span className="text-sm font-bold text-[#17332D]">{t}</span>
                  <span className="text-xs font-bold px-3 py-1 bg-[#DDF3ED] text-[#0F5C4D] rounded-full">{15 - i*3} sesi</span>
                </div>
              ))}
            </div>
          </Card>
        </div>
      );
    }

    function TeacherModulView({ documents, setDocuments, showToast }) {
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ title: "", subject: SUBJECTS[0], grade: 5, chapter: "", content: "" });
      const [isExtracting, setIsExtracting] = useState(false);
      
      const [filterSubject, setFilterSubject] = useState("Semua Mapel");
      const [filterChapter, setFilterChapter] = useState("Semua Bab");

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsExtracting(true);
        setTimeout(() => {
          setForm({ ...form, title: file.name.split('.')[0], content: `[Teks hasil ekstraksi otomatis dari dokumen ${file.name}]\n\nDokumen ini berisi rangkuman materi pokok yang diurai oleh AI untuk dibaca sebagai rujukan utama sistem saat menjawab siswa.` });
          setIsExtracting(false);
          showToast("Teks berhasil diekstrak dari dokumen.");
        }, 1500);
      };

      const save = (e) => {
        e.preventDefault();
        if(!form.title || !form.content) return;
        const newDoc = { id: crypto.randomUUID(), ...form, grade: Number(form.grade), keywords: form.title.toLowerCase().split(" "), status: "approved" };
        const updated = [newDoc, ...documents];
        setDocuments(updated);
        localStorage.setItem("iqra-docs", JSON.stringify(updated));
        setShowForm(false); setForm({ title: "", subject: SUBJECTS[0], grade: 5, chapter: "", content: "" });
        showToast("Modul berhasil diterbitkan ke pustaka siswa.");
      };

      const remove = (id) => {
        const updated = documents.filter(d => d.id !== id);
        setDocuments(updated);
        localStorage.setItem("iqra-docs", JSON.stringify(updated));
        showToast("Modul berhasil dihapus.");
      }

      const availableChapters = [...new Set(documents.filter(d => filterSubject === "Semua Mapel" || d.subject === filterSubject).map(d => d.chapter))];
      const filteredDocs = documents.filter(d => {
        const matchSubject = filterSubject === "Semua Mapel" || d.subject === filterSubject;
        const matchChapter = filterChapter === "Semua Bab" || d.chapter === filterChapter;
        return matchSubject && matchChapter;
      });

      return (
        <div className="p-6 md:p-10 max-w-5xl mx-auto space-y-6 pb-24">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Kelola Modul AI</h2>
              <p className="text-sm text-gray-500 font-medium mt-1">Repositori bahan bacaan khusus yang digunakan AI.</p>
            </div>
            <button onClick={()=>setShowForm(true)} className="px-5 py-2.5 bg-[#0F5C4D] text-white text-sm font-bold rounded-xl flex gap-2 shadow-md hover:bg-[#177E6A] transition-colors"><Lucide.Plus size={18}/> Unggah Modul</button>
          </div>
          
          {showForm && (
            <Card className="border-l-4 border-[#0F5C4D] rise-in shadow-md">
              <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-[#17332D]">Formulir Pendaftaran Modul</h3><button onClick={()=>setShowForm(false)} className="text-gray-400 hover:text-gray-800"><Lucide.X size={18}/></button></div>
              <form onSubmit={save} className="space-y-4">
                <div className="p-6 border-2 border-dashed border-[#B8E1D5] rounded-xl text-center bg-[#DDF3ED]/30 relative hover:bg-[#DDF3ED]/60 transition-colors cursor-pointer">
                  <input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx" onChange={handleFileChange} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Pilih File" />
                  {isExtracting ? <div className="text-[#0F5C4D] flex flex-col items-center justify-center gap-2 text-sm font-bold"><Lucide.Loader2 className="animate-spin" size={24}/> Mengekstrak teks dari file...</div> : <div className="text-[#0F5C4D] text-sm flex flex-col items-center gap-2"><Lucide.FileUp size={28}/> <span className="font-bold">Klik atau Seret file PDF/Word/PPT ke sini</span><span className="text-xs opacity-70">AI akan otomatis mengekstrak teks di dalamnya</span></div>}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Judul Modul</label><input required value={form.title} onChange={e=>setForm({...form, title: e.target.value})} placeholder="Contoh: Modul Pancasila Bab 1" className="w-full border-2 border-gray-100 focus:border-[#0F5C4D] outline-none rounded-xl px-4 py-2.5 text-sm text-[#17332D]"/></div>
                  <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Nama Bab / Topik</label><input required value={form.chapter} onChange={e=>setForm({...form, chapter: e.target.value})} placeholder="Contoh: Gotong Royong" className="w-full border-2 border-gray-100 focus:border-[#0F5C4D] outline-none rounded-xl px-4 py-2.5 text-sm text-[#17332D]"/></div>
                  <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Mata Pelajaran</label><select value={form.subject} onChange={e=>setForm({...form, subject: e.target.value})} className="w-full border-2 border-gray-100 focus:border-[#0F5C4D] outline-none rounded-xl px-4 py-2.5 text-sm text-[#17332D] bg-white">{SUBJECTS.map(s=><option key={s}>{s}</option>)}</select></div>
                  <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Target Kelas</label><select value={form.grade} onChange={e=>setForm({...form, grade: e.target.value})} className="w-full border-2 border-gray-100 focus:border-[#0F5C4D] outline-none rounded-xl px-4 py-2.5 text-sm text-[#17332D] bg-white"><option value={4}>Kelas 4</option><option value={5}>Kelas 5</option><option value={6}>Kelas 6</option></select></div>
                </div>
                <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Teks Referensi</label><textarea required rows={5} value={form.content} onChange={e=>setForm({...form, content: e.target.value})} placeholder="Teks referensi yang akan dibaca AI..." className="w-full border-2 border-gray-100 focus:border-[#0F5C4D] outline-none rounded-xl p-4 text-sm text-[#17332D]"/></div>
                <div className="flex justify-end gap-2 pt-2"><button type="submit" className="px-6 py-3 bg-[#0F5C4D] text-white rounded-xl text-sm font-bold shadow-md hover:bg-[#177E6A] transition-colors">Terbitkan ke Siswa</button></div>
              </form>
            </Card>
          )}

          <div className="flex flex-col sm:flex-row gap-4 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
            <div className="flex-1">
              <label className="text-xs font-bold text-gray-500 mb-1.5 block">Filter Mapel</label>
              <select value={filterSubject} onChange={e => {setFilterSubject(e.target.value); setFilterChapter("Semua Bab");}} className="w-full border-2 border-gray-100 rounded-xl px-4 py-2 text-sm text-[#17332D] outline-none focus:border-[#0F5C4D]"><option>Semua Mapel</option>{SUBJECTS.map(s=><option key={s}>{s}</option>)}</select>
            </div>
            <div className="flex-1">
              <label className="text-xs font-bold text-gray-500 mb-1.5 block">Filter Bab</label>
              <select value={filterChapter} onChange={e => setFilterChapter(e.target.value)} className="w-full border-2 border-gray-100 rounded-xl px-4 py-2 text-sm text-[#17332D] outline-none focus:border-[#0F5C4D]"><option>Semua Bab</option>{availableChapters.map(c=><option key={c}>{c}</option>)}</select>
            </div>
          </div>

          <div className="space-y-4">
            {filteredDocs.map(d => (
              <Card key={d.id} className="hover:shadow-md transition-shadow">
                <div className="flex justify-between items-start gap-4">
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-[10px] bg-[#DDF3ED] text-[#0F5C4D] px-2 py-1 rounded-md font-bold uppercase tracking-wider">{d.subject}</span>
                      <span className="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-bold uppercase tracking-wider">Kelas {d.grade}</span>
                      <span className="text-[10px] text-gray-500 font-bold">Bab: {d.chapter}</span>
                    </div>
                    <h3 className="font-bold text-lg text-[#17332D]">{d.title}</h3>
                    <p className="text-sm text-gray-600 line-clamp-2 mt-1.5">{d.content}</p>
                  </div>
                  <button onClick={()=>remove(d.id)} className="p-2.5 bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition-colors" title="Hapus Modul"><Lucide.Trash2 size={18}/></button>
                </div>
              </Card>
            ))}
            {filteredDocs.length === 0 && <div className="text-center py-12 bg-white rounded-xl border-2 border-dashed border-gray-200"><p className="text-gray-500 font-medium">Tidak ada modul yang cocok dengan filter.</p></div>}
          </div>
        </div>
      );
    }

    function TeacherTugasView({ assignments, setAssignments, submissions, showToast }) {
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ title: "", subject: SUBJECTS[0], grade: 5, question: "", reference: "" });
      const [activeSubs, setActiveSubs] = useState(null);

      const handleCreate = (e) => {
        e.preventDefault();
        const newAsm = { id: crypto.randomUUID(), ...form, grade: Number(form.grade) };
        const updated = [newAsm, ...assignments];
        setAssignments(updated); localStorage.setItem("iqra-assignments", JSON.stringify(updated));
        setForm({ title: "", subject: SUBJECTS[0], grade: 5, question: "", reference: "" }); setShowForm(false); showToast("Tugas dipublikasikan.");
      }
      const deleteAsm = (id) => {
        const updated = assignments.filter(a => a.id !== id);
        setAssignments(updated); localStorage.setItem("iqra-assignments", JSON.stringify(updated)); showToast("Tugas dihapus.");
      }

      return (
        <div className="p-6 md:p-10 max-w-5xl mx-auto space-y-6 pb-24">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Kelola Tugas LMS</h2>
              <p className="text-sm text-gray-500 font-medium mt-1">Buat soal esai dan biarkan AI membantu mengoreksi.</p>
            </div>
            <button onClick={()=>setShowForm(true)} className="px-5 py-2.5 bg-[#0F5C4D] text-white text-sm font-bold rounded-xl flex gap-2 shadow-md hover:bg-[#177E6A] transition-colors"><Lucide.Plus size={18}/> Buat Tugas</button>
          </div>

          {showForm && (
            <Card className="border-l-4 border-[#0F5C4D] rise-in shadow-md">
              <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-[#17332D]">Formulasi Soal Ujian Baru</h3><button onClick={()=>setShowForm(false)} className="text-gray-400 hover:text-gray-800"><Lucide.X size={18}/></button></div>
              <form onSubmit={handleCreate} className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Judul Ujian/Tugas</label><input required value={form.title} onChange={e=>setForm({...form, title: e.target.value})} placeholder="Contoh: Evaluasi Tengah Semester" className="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 text-sm text-[#17332D] outline-none focus:border-[#0F5C4D]"/></div>
                  <div>
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Mapel</label><select value={form.subject} onChange={e=>setForm({...form, subject: e.target.value})} className="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 text-sm text-[#17332D] bg-white outline-none focus:border-[#0F5C4D]">{SUBJECTS.map(s=><option key={s}>{s}</option>)}</select></div>
                      <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Kelas</label><select value={form.grade} onChange={e=>setForm({...form, grade: e.target.value})} className="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 text-sm text-[#17332D] bg-white outline-none focus:border-[#0F5C4D]"><option value={4}>Kelas 4</option><option value={5}>Kelas 5</option><option value={6}>Kelas 6</option></select></div>
                    </div>
                  </div>
                </div>
                <div><label className="text-xs font-bold text-gray-500 mb-1.5 block">Instruksi Soal Uraian</label><textarea required rows={3} value={form.question} onChange={e=>setForm({...form, question: e.target.value})} placeholder="Sebutkan dan jelaskan..." className="w-full border-2 border-gray-100 rounded-xl p-4 text-sm text-[#17332D] outline-none focus:border-[#0F5C4D]"/></div>
                <div><label className="text-xs font-bold text-[#0F5C4D] mb-1.5 block">Kunci Jawaban Guru (Pedoman AI)</label><textarea required rows={3} value={form.reference} onChange={e=>setForm({...form, reference: e.target.value})} placeholder="Poin wajib ada dalam jawaban siswa..." className="w-full border-2 border-[#DDF3ED] rounded-xl p-4 text-sm text-[#0F5C4D] bg-[#F3FAF8] outline-none focus:border-[#0F5C4D]"/></div>
                <button type="submit" className="w-full py-3.5 bg-[#0F5C4D] text-white rounded-xl text-sm font-bold shadow-md hover:bg-[#177E6A] transition-colors">Publikasikan Ujian ke Siswa</button>
              </form>
            </Card>
          )}

          <div className="space-y-4">
            {assignments.map(asm => {
              const subs = submissions.filter(s => s.assignmentId === asm.id);
              return (
                <Card key={asm.id} className="hover:shadow-md transition-shadow">
                  <div className="flex flex-col md:flex-row justify-between items-start gap-4">
                    <div className="flex-1">
                      <span className="text-[10px] bg-[#DDF3ED] text-[#0F5C4D] px-2 py-1 rounded-md font-bold uppercase tracking-wider">{asm.subject} · Kelas {asm.grade}</span>
                      <h3 className="font-bold text-lg mt-2 text-[#17332D]">{asm.title}</h3>
                      <p className="text-sm text-gray-600 line-clamp-2 mt-1.5">{asm.question}</p>
                    </div>
                    <div className="flex gap-2 w-full md:w-auto">
                      <button onClick={()=>setActiveSubs({asm, subs})} className="flex-1 md:flex-none text-xs font-bold text-[#0F5C4D] bg-[#DDF3ED] px-4 py-2.5 rounded-xl hover:bg-[#B8E1D5] transition-colors whitespace-nowrap flex items-center justify-center gap-1.5"><Lucide.Inbox size={16}/> Koreksi AI ({subs.length})</button>
                      <button onClick={()=>deleteAsm(asm.id)} className="text-xs text-red-500 p-2.5 hover:bg-red-50 rounded-xl transition-colors"><Lucide.Trash2 size={16}/></button>
                    </div>
                  </div>
                </Card>
              )
            })}
            {assignments.length === 0 && !showForm && <div className="text-center py-12 bg-white rounded-xl border-2 border-dashed border-gray-200"><p className="text-gray-500 font-medium">Belum ada tugas/ujian yang dipublikasikan.</p></div>}
          </div>

          {activeSubs && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#17332D]/60 backdrop-blur-sm">
              <div className="bg-white w-full max-w-2xl rounded-2xl flex flex-col max-h-[90vh] shadow-2xl rise-in">
                <div className="p-5 border-b border-gray-100 flex justify-between items-center bg-[#0F5C4D] text-white rounded-t-2xl"><h3 className="font-bold text-base">Hasil Koreksi AI: {activeSubs.asm.title}</h3><button onClick={()=>setActiveSubs(null)} className="hover:text-gray-200"><Lucide.X size={18}/></button></div>
                <div className="p-6 overflow-y-auto space-y-4 bg-[#F8F7F2] flex-1">
                  <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-sm"><strong className="text-[#17332D] block mb-1">Rujukan Guru:</strong> <span className="text-gray-600">{activeSubs.asm.reference}</span></div>
                  {activeSubs.subs.map((s,i)=>(
                    <div key={i} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                      <div className="flex justify-between border-b border-gray-100 pb-3 mb-4"><span className="font-bold text-lg text-[#17332D]">{s.studentName}</span><span className={`font-display font-bold text-xl ${s.score>70?'text-[#2E8B68]':'text-[#C58A25]'}`}>Nilai: {s.score}</span></div>
                      <p className="text-sm mb-4 text-gray-700 italic leading-relaxed">"{s.answer}"</p>
                      <div className="text-sm bg-[#FDF5E3] border border-[#F5E4BE] text-[#7A5C1A] p-4 rounded-xl flex items-start gap-3">
                        <Lucide.Brain size={18} className="mt-0.5 shrink-0 text-[#C58A25]"/>
                        <div><strong className="block mb-1 text-[#C58A25]">Analisis Evaluator AI:</strong> <span className="font-medium">{s.feedback}</span></div>
                      </div>
                    </div>
                  ))}
                  {activeSubs.subs.length === 0 && <div className="text-center py-12"><p className="text-gray-500 font-medium">Belum ada siswa yang mengumpulkan tugas ini.</p></div>}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function TeacherDomainView({ sources, setSources, showToast }) {
      const [form, setForm] = useState({ domain: "", org: "" });

      const save = (e) => {
        e.preventDefault();
        if (!form.domain || !form.org) return;
        const newSource = { id: crypto.randomUUID(), ...form, active: true };
        const updated = [newSource, ...sources];
        setSources(updated);
        localStorage.setItem("iqra-domains", JSON.stringify(updated));
        setForm({ domain: "", org: "" });
        showToast("Domain rujukan berhasil ditambahkan.");
      };

      const toggleStatus = (id) => {
        const updated = sources.map(s => s.id === id ? { ...s, active: !s.active } : s);
        setSources(updated);
        localStorage.setItem("iqra-domains", JSON.stringify(updated));
      };

      const removeSource = (id) => {
        const updated = sources.filter(s => s.id !== id);
        setSources(updated);
        localStorage.setItem("iqra-domains", JSON.stringify(updated));
        showToast("Domain dihapus.");
      };

      return (
        <div className="p-6 md:p-10 max-w-4xl mx-auto space-y-6 pb-24">
          <div>
            <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Kelola Domain Rujukan</h2>
            <p className="text-sm text-gray-500 font-medium mt-1">Daftar situs web terpercaya (Tingkat 2) yang diizinkan untuk diakses AI.</p>
          </div>
          <Card className="border-l-4 border-[#0F5C4D]">
            <form onSubmit={save} className="flex flex-col sm:flex-row gap-3">
              <input required value={form.domain} onChange={e=>setForm({...form, domain: e.target.value})} placeholder="Domain (cth: kemdikbud.go.id)" className="flex-1 border-2 border-gray-100 focus:border-[#0F5C4D] rounded-xl px-4 py-2.5 text-sm bg-gray-50 outline-none" />
              <input required value={form.org} onChange={e=>setForm({...form, org: e.target.value})} placeholder="Nama Organisasi" className="flex-1 border-2 border-gray-100 focus:border-[#0F5C4D] rounded-xl px-4 py-2.5 text-sm bg-gray-50 outline-none" />
              <button type="submit" className="px-6 py-2.5 bg-[#0F5C4D] text-white rounded-xl text-sm font-bold shadow-md hover:bg-[#177E6A] transition-colors">Tambah</button>
            </form>
          </Card>
          <div className="space-y-3">
            {sources.map(s => (
              <Card key={s.id} className="py-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <Lucide.Globe size={20} className={s.active ? "text-[#0F5C4D]" : "text-gray-400"} />
                    <div>
                      <p className="text-sm font-bold text-[#17332D]">{s.org}</p>
                      <p className="text-xs font-medium text-gray-500">{s.domain}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={() => toggleStatus(s.id)} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-colors ${s.active ? 'bg-[#DDF3ED] text-[#0F5C4D]' : 'bg-gray-100 text-gray-500'}`}>
                      {s.active ? 'Status: Aktif' : 'Status: Nonaktif'}
                    </button>
                    <button onClick={() => removeSource(s.id)} className="p-2 text-gray-400 hover:text-red-500 bg-gray-50 hover:bg-red-50 rounded-lg transition-colors"><Lucide.Trash2 size={16}/></button>
                  </div>
                </div>
              </Card>
            ))}
            {sources.length === 0 && <div className="text-center py-8 text-gray-500 text-sm font-medium border-2 border-dashed rounded-xl">Belum ada domain rujukan.</div>}
          </div>
        </div>
      );
    }

    function SystemSettingsView({ settings, setSettings, showToast }) {
      const [localSet, setLocalSet] = useState(settings);

      const save = () => {
        setSettings(localSet);
        localStorage.setItem("iqra-settings", JSON.stringify(localSet));
        showToast("Pengaturan sistem & filosofi berhasil diperbarui.");
      };

      const updatePhil = (index, key, val) => {
        const newPhils = [...localSet.philosophies];
        newPhils[index] = { ...newPhils[index], [key]: val };
        setLocalSet({ ...localSet, philosophies: newPhils });
      };

      return (
        <div className="p-6 md:p-10 max-w-4xl mx-auto pb-24">
          <div className="mb-8">
            <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Pengaturan Sistem</h2>
            <p className="text-sm text-gray-500 font-medium mt-1">Kelola keamanan akses siswa dan panduan filosofis portal.</p>
          </div>

          <Card className="mb-8 border-t-4 border-t-[#0F5C4D]">
            <h3 className="text-base font-bold text-[#17332D] mb-5 flex items-center gap-2"><Lucide.Key size={18} className="text-[#0F5C4D]"/> Kunci Keamanan Siswa</h3>
            <div className="grid sm:grid-cols-2 gap-6">
              <div>
                <label className="text-xs font-bold text-gray-500 mb-2 block uppercase tracking-wide">Sandi Login Portal Siswa</label>
                <input value={localSet.studentPassword} onChange={e=>setLocalSet({...localSet, studentPassword: e.target.value})} className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 text-sm font-medium focus:border-[#0F5C4D] outline-none bg-gray-50" />
                <p className="text-xs text-gray-400 mt-2">Sandi universal bagi seluruh siswa untuk masuk ke ruang belajar.</p>
              </div>
              <div>
                <label className="text-xs font-bold text-gray-500 mb-2 block uppercase tracking-wide">Sandi Brankas Ujian (LMS)</label>
                <input value={localSet.lmsPassword} onChange={e=>setLocalSet({...localSet, lmsPassword: e.target.value})} className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 text-sm font-medium focus:border-[#0F5C4D] outline-none bg-gray-50" />
                <p className="text-xs text-gray-400 mt-2">Sandi tambahan (OTP) yang diberikan sebelum ujian dimulai.</p>
              </div>
            </div>
          </Card>

          <Card className="mb-8 border-t-4 border-t-[#D9A441]">
            <h3 className="text-base font-bold text-[#17332D] mb-5 flex items-center gap-2"><Lucide.BookHeart size={18} className="text-[#D9A441]"/> Lima Pilar Filosofi Pembelajaran</h3>
            <div className="space-y-4">
              {localSet.philosophies.map((p, i) => (
                <div key={i} className="flex flex-col sm:flex-row gap-4 p-4 bg-gray-50 rounded-xl border border-gray-100">
                  <input value={p.icon} onChange={e=>updatePhil(i, 'icon', e.target.value)} className="w-16 h-16 text-center text-3xl border-2 border-gray-200 rounded-xl bg-white shadow-sm focus:border-[#D9A441] outline-none" title="Ikon Emoji" />
                  <div className="flex-1 space-y-3">
                    <div>
                      <label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Judul Pilar</label>
                      <input value={p.title} onChange={e=>updatePhil(i, 'title', e.target.value)} className="w-full font-bold text-sm border-2 border-gray-200 rounded-lg px-3 py-2 bg-white focus:border-[#D9A441] outline-none shadow-sm" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Deskripsi Singkat</label>
                      <input value={p.desc} onChange={e=>updatePhil(i, 'desc', e.target.value)} className="w-full text-sm font-medium border-2 border-gray-200 rounded-lg px-3 py-2 text-gray-600 bg-white focus:border-[#D9A441] outline-none shadow-sm" />
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          <div className="flex justify-end">
            <button onClick={save} className="bg-[#0F5C4D] text-white font-bold py-3.5 px-8 rounded-xl text-sm w-full sm:w-auto shadow-lg hover:bg-[#177E6A] transition-all flex items-center justify-center gap-2">
              <Lucide.Save size={16}/> Simpan Pembaruan Sistem
            </button>
          </div>
        </div>
      );
    }

    /* ============================================================
       STUDENT VIEWS
       ============================================================ */
    function StudentDashboard({ profile, history, settings, setView }) {
      return (
        <div className="p-6 md:p-10 max-w-5xl mx-auto space-y-10 pb-24">
          <div>
            <h2 className="font-display text-3xl md:text-4xl font-bold text-[#17332D] tracking-tight">Beranda Belajar</h2>
            <p className="text-base text-gray-500 font-medium mt-2">Assalamu'alaikum, <span className="font-bold text-[#0F5C4D]">{profile.name}</span>. Hari yang cerah untuk menuntut ilmu.</p>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <Card className="hover:border-[#0F5C4D]/30 transition-colors"><div className="w-10 h-10 rounded-lg bg-[#DDF3ED] text-[#0F5C4D] flex items-center justify-center mb-4"><Lucide.GraduationCap size={20}/></div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Tingkat</p><h3 className="font-display font-bold text-xl text-[#17332D]">Kelas {profile.grade}</h3></Card>
            <Card className="hover:border-[#D9A441]/50 transition-colors"><div className="w-10 h-10 rounded-lg bg-[#F8EAC5] text-[#C58A25] flex items-center justify-center mb-4"><Lucide.MessageCircle size={20}/></div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Pertanyaan</p><h3 className="font-display font-bold text-xl text-[#17332D]">{history.length} Sesi</h3></Card>
            <Card className="hover:border-[#0F5C4D]/30 transition-colors"><div className="w-10 h-10 rounded-lg bg-[#DDF3ED] text-[#0F5C4D] flex items-center justify-center mb-4"><Lucide.TrendingUp size={20}/></div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Capaian</p><h3 className="font-display font-bold text-xl text-[#17332D]">{history.length * 10} XP</h3></Card>
            <Card className="hover:border-[#D9A441]/50 transition-colors"><div className="w-10 h-10 rounded-lg bg-[#F8EAC5] text-[#C58A25] flex items-center justify-center mb-4"><Lucide.Flame size={20}/></div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Konsistensi</p><h3 className="font-display font-bold text-xl text-[#17332D]">{Math.min(history.length + 1, 7)} Hari</h3></Card>
          </div>

          <div className="rounded-2xl p-7 md:p-10 relative overflow-hidden flex flex-col md:flex-row items-start md:items-center justify-between gap-6 shadow-sm" style={{ background: C.emerald }}>
            <div className="absolute right-0 top-0 opacity-10 pointer-events-none transform translate-x-1/4 -translate-y-1/4"><GeoMotif size={350} color="#FFFFFF" opacity={1} /></div>
            <div className="relative z-10 max-w-xl">
              <h3 className="text-white font-display text-2xl font-bold mb-2">Punya pertanyaan seputar materi kelasmu?</h3>
              <p className="text-sm leading-relaxed" style={{ color: C.emeraldBg }}>IQRA' AI siap membantu menjawab dan membimbingmu belajar berdasarkan buku panduan resmi dari guru.</p>
            </div>
            <button onClick={() => setView("ask")} className="relative z-10 rounded-xl px-6 py-3.5 text-sm font-bold shadow-md transition-transform hover:scale-105 active:scale-95" style={{ background: C.gold, color: "#FFF" }}>
              Buka Ruang Diskusi
            </button>
          </div>

          <div>
            <h3 className="font-display text-xl font-bold text-[#17332D] mb-4">Pilar Belajar IQRA'</h3>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
              {settings.philosophies.map((p, i) => (
                <div key={i} className="bg-white border border-gray-100 rounded-xl p-5 text-center hover:shadow-md transition-shadow">
                  <div className="text-3xl mb-3">{p.icon}</div>
                  <h4 className="text-xs font-bold text-[#0F5C4D] mb-1.5">{p.title}</h4>
                  <p className="text-[10px] text-gray-500 leading-relaxed">{p.desc}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function AskIqraView({ profile, documents, onNewExchange }) {
      const [mode, setMode] = useState("jelaskan");
      const [subject, setSubject] = useState(SUBJECTS[2]);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [showInfo, setShowInfo] = useState(false);
      const scrollRef = useRef(null);

      useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" }); }, [messages, loading]);

      const send = () => {
        const q = input.trim();
        if (!q || loading) return;
        setInput("");
        setMessages(m => [...m, { id: crypto.randomUUID(), role: "user", text: q }]);
        setLoading(true);
        
        setTimeout(() => {
          const qLower = q.toLowerCase();
          const docs = documents.filter(d => d.grade === profile.grade && (subject === "Semua" || d.subject === subject));
          let match = docs.find(d => d.keywords.some(k => qLower.includes(k)));
          
          let aiResponse = { shortAnswer: "", explanation: "", thinkPrompt: null, sources: [], sourceStrength: "red" };

          if (mode === "buku") {
            if (match) {
              aiResponse = { shortAnswer: `Ditemukan pada bab ${match.chapter}.`, explanation: match.content, sourceStrength: "green", sources: [{ icon: "📘", label: match.title, detail: `Hal. referensi` }] };
            } else {
              aiResponse = { shortAnswer: "Maaf, referensi tersebut tidak ada dalam materi unggahan guru.", explanation: "Sesuai mode 'Buku Teks', saya hanya merujuk pada literatur kelas yang sudah diverifikasi. Silakan tanyakan hal lain.", sourceStrength: "red" };
            }
          } else if (mode === "detektif") {
             aiResponse = { shortAnswer: "Mari kita selidiki pertanyaannya bersama-sama.", explanation: match ? `Berdasarkan ${match.title}, ada konsep kunci yang bisa kita pakai.` : "Coba perhatikan baik-baik. Apa saja informasi yang sudah kamu ketahui sejauh ini?", thinkPrompt: "Langkah pertama apa yang sebaiknya kita ambil?", sourceStrength: match ? "green" : "yellow", sources: match ? [{ icon: "📘", label: match.title, detail: match.chapter }] : [] };
          } else if (mode === "aha") {
             aiResponse = { shortAnswer: "Gunakan pendekatan AHA untuk memecahkan masalah ini.", explanation: "Coba sederhanakan masalahnya. Jika kita memecahnya menjadi bagian kecil, apakah ada pola yang berulang?", thinkPrompt: "Jika nilai atau kondisinya diubah menjadi sesuatu yang ekstrem, apa yang terjadi?", sourceStrength: match ? "green" : "yellow", sources: match ? [{ icon: "📘", label: match.title, detail: match.chapter }] : [] };
          } else {
             aiResponse = { shortAnswer: match ? "Berikut ringkasan berdasarkan materi kelasmu." : "Berikut penjelasan konsep dasarnya.", explanation: match ? `${match.content}` : "Ini adalah penjelasan general berdasarkan literatur umum AI. Mengingat materi spesifik dari guru belum tersedia untuk kueri ini, konsep ini berlaku universal.", sourceStrength: match ? "green" : "orange", sources: match ? [{ icon: "📘", label: match.title, detail: match.chapter }] : [] };
          }

          const newMsg = { id: crypto.randomUUID(), role: "ai", data: aiResponse };
          setMessages(m => [...m, newMsg]);
          onNewExchange({ question: q, subject, data: aiResponse, ts: Date.now() });
          setLoading(false);
        }, 1500);
      };

      const fetchAyat = async (msgId) => {
        setMessages(m => m.map(x => x.id === msgId ? {...x, isFetchingAyat: true} : x));
        try {
          const res = await fetch(`https://api.alquran.cloud/v1/search/${encodeURIComponent("ilmu")}/all/id.indonesian`);
          const data = await res.json();
          const match = data?.data?.matches?.[0];
          if (match) {
             const detail = await fetch(`https://api.alquran.cloud/v1/ayah/${match.number}/editions/quran-uthmani,id.indonesian`);
             const dData = await detail.json();
             const ayatObj = { surah: match.surah.englishName, num: match.numberInSurah, arabic: dData.data[0].text, trans: dData.data[1].text };
             setMessages(m => m.map(x => x.id === msgId ? {...x, isFetchingAyat: false, ayat: ayatObj} : x));
          }
        } catch {
          setMessages(m => m.map(x => x.id === msgId ? {...x, isFetchingAyat: false} : x));
        }
      };

      return (
        <div className="flex flex-col h-full bg-[#FAF9F5]">
          <div className="px-4 py-3 bg-white border-b border-gray-200 shrink-0 z-10 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-1.5 overflow-x-auto iqra-scroll pb-1">
              {MODES.map(m => {
                const Icon = Lucide[m.icon];
                return (
                  <button key={m.id} onClick={() => setMode(m.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap border-2 ${mode === m.id ? 'bg-[#0F5C4D] border-[#0F5C4D] text-white' : 'bg-white border-gray-100 text-gray-500 hover:border-[#DDF3ED]'}`}>
                    <Icon size={14} /> {m.label}
                  </button>
                )
              })}
              <button onClick={()=>setShowInfo(true)} className="p-1.5 text-gray-400 hover:text-[#D9A441] transition-colors" title="Bantuan Mode"><Lucide.HelpCircle size={18}/></button>
            </div>
            <select value={subject} onChange={e=>setSubject(e.target.value)} className="ml-2 text-xs font-bold bg-gray-50 border-2 border-gray-100 rounded-lg px-2 py-1.5 outline-none focus:border-[#0F5C4D]">
              <option>Semua</option>{SUBJECTS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>

          {showInfo && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#17332D]/40 backdrop-blur-sm">
               <div className="w-full max-w-md bg-white rounded-2xl p-6 shadow-2xl rise-in relative">
                 <button onClick={()=>setShowInfo(false)} className="absolute top-4 right-4 p-1.5 text-gray-400 hover:bg-gray-100 rounded-full"><Lucide.X size={18}/></button>
                 <h3 className="font-display font-bold text-xl mb-4 text-[#17332D]">Panduan Mode AI</h3>
                 <div className="space-y-4 mb-6">
                   {MODES.map(m => {
                     const Icon = Lucide[m.icon];
                     return <div key={m.id} className="flex items-start gap-3"><div className="p-2 bg-[#DDF3ED] text-[#0F5C4D] rounded-lg"><Icon size={18}/></div><div><h4 className="font-bold text-sm text-[#17332D]">{m.label}</h4><p className="text-xs text-gray-600">{m.desc}</p></div></div>
                   })}
                 </div>
                 <button onClick={()=>setShowInfo(false)} className="w-full py-3 bg-[#0F5C4D] text-white rounded-xl font-bold text-sm">Mengerti</button>
               </div>
            </div>
          )}

          <div ref={scrollRef} className="flex-1 overflow-y-auto iqra-scroll p-4 md:p-8 space-y-6 pb-24">
            {messages.length === 0 && (
              <div className="flex flex-col items-center justify-center h-full text-center max-w-md mx-auto opacity-70">
                <Lucide.MessageSquareDashed size={48} className="text-[#0F5C4D] mb-4 opacity-50"/>
                <p className="font-display font-bold text-xl text-[#17332D]">Ruang Diskusi Cerdas</p>
                <p className="text-sm font-medium text-gray-500 mt-2">Pilih mode di atas dan mulai tanyakan materi pelajaranmu.</p>
              </div>
            )}
            
            {messages.map(m => {
              if (m.role === "user") {
                return <div key={m.id} className="flex justify-end rise-in"><div className="bg-[#177E6A] text-white max-w-[85%] rounded-2xl rounded-tr-sm px-5 py-3 text-sm shadow-md font-medium">{m.text}</div></div>
              }
              return (
                <div key={m.id} className="flex justify-start rise-in">
                  <div className="bg-white border border-gray-200 max-w-[90%] w-full rounded-2xl rounded-tl-sm p-5 shadow-sm">
                    <p className="font-bold text-[#17332D] text-sm mb-2 pb-2 border-b border-gray-100">{m.data.shortAnswer}</p>
                    {m.data.explanation && <p className="text-sm text-gray-700 leading-relaxed">{m.data.explanation}</p>}
                    
                    {m.data.thinkPrompt && (
                      <div className="mt-4 p-3.5 bg-[#F8EAC5] border border-[#D9A441]/30 rounded-xl flex gap-3">
                        <Lucide.Brain size={18} className="text-[#C58A25] shrink-0 mt-0.5"/>
                        <div><p className="text-[10px] font-bold uppercase tracking-widest text-[#C58A25] mb-1">Pertanyaan Pemantik</p><p className="text-sm font-medium text-[#5a4313]">{m.data.thinkPrompt}</p></div>
                      </div>
                    )}

                    {m.data.sources?.length > 0 && (
                      <div className="mt-4 bg-gray-50 border border-gray-100 rounded-xl overflow-hidden">
                        <div className="bg-gray-100 px-3 py-2 flex items-center justify-between border-b border-gray-200"><span className="text-[10px] font-bold uppercase tracking-widest text-gray-500 flex items-center gap-1"><Lucide.BookMarked size={12}/> Referensi Terdeteksi</span><StrengthBadge level={m.data.sourceStrength}/></div>
                        <div className="p-3 space-y-2">
                          {m.data.sources.map((s,i) => <div key={i} className="flex gap-2 text-sm text-[#17332D]"><span className="opacity-80">{s.icon}</span><div><p className="font-bold">{s.label}</p><p className="text-xs text-gray-500">{s.detail}</p></div></div>)}
                        </div>
                      </div>
                    )}
                    {m.data.sources?.length === 0 && <div className="mt-4"><StrengthBadge level={m.data.sourceStrength}/></div>}

                    <div className="mt-4 pt-3 border-t border-gray-100 flex gap-2">
                      <button onClick={()=>fetchAyat(m.id)} disabled={m.isFetchingAyat || m.ayat} className="px-3 py-1.5 bg-[#DDF3ED] text-[#0F5C4D] rounded-lg text-xs font-bold hover:bg-[#177E6A] hover:text-white transition-colors flex items-center gap-1.5 disabled:opacity-50">
                        {m.isFetchingAyat ? <Lucide.Loader2 size={12} className="animate-spin"/> : <Lucide.BookOpen size={12}/>} Relevansi Ayat
                      </button>
                    </div>

                    {m.ayat && (
                       <div className="mt-4 p-4 bg-white border border-[#D9A441]/50 rounded-xl rise-in shadow-inner">
                         <span className="text-[10px] font-bold uppercase tracking-widest text-[#D9A441] block mb-3">QS. {m.ayat.surah} : {m.ayat.num}</span>
                         <p className="font-arabic text-2xl leading-loose text-right mb-3 text-[#17332D]" dir="rtl">{m.ayat.arabic}</p>
                         <p className="text-sm text-gray-600 border-l-2 border-[#D9A441] pl-3 italic">"{m.ayat.trans}"</p>
                       </div>
                    )}
                  </div>
                </div>
              );
            })}
            {loading && <div className="flex items-center gap-2 text-sm font-bold text-[#0F5C4D] bg-white p-3 rounded-xl shadow-sm border border-gray-100 w-max"><Lucide.Loader2 size={16} className="animate-spin"/> AI sedang menganalisis...</div>}
          </div>

          <div className="absolute bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200">
             <div className="max-w-4xl mx-auto flex items-center gap-2 p-1.5 bg-gray-50 border-2 border-gray-200 focus-within:border-[#0F5C4D] rounded-2xl transition-colors shadow-sm">
                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder={`Tanya materi pelajaran...`} className="flex-1 px-4 py-2.5 text-sm font-medium bg-transparent outline-none text-[#17332D]"/>
                <button onClick={send} disabled={loading||!input} className="p-3 bg-[#0F5C4D] text-white rounded-xl hover:bg-[#177E6A] disabled:opacity-50 transition-colors shadow-md"><Lucide.Send size={18}/></button>
             </div>
          </div>
        </div>
      );
    }

    function MaterikuView({ documents, profile }) {
      const docs = documents.filter(d => d.grade === profile.grade);
      return (
        <div className="p-6 md:p-10 max-w-4xl mx-auto space-y-6 pb-24">
          <div>
            <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Perpustakaan Kelas</h2>
            <p className="text-sm text-gray-500 font-medium mt-1">Literatur yang terverifikasi dan direkomendasikan guru.</p>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            {docs.map(d => (
              <Card key={d.id} className="border-l-4 border-[#0F5C4D]">
                <div className="flex items-center gap-2 mb-2"><span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-[#DDF3ED] text-[#0F5C4D]">{d.subject}</span></div>
                <h3 className="font-bold text-[#17332D] text-lg leading-tight mb-1">{d.title}</h3>
                <p className="text-xs text-gray-500 font-medium mb-3">Bab: {d.chapter}</p>
                <p className="text-sm text-gray-600 line-clamp-3 leading-relaxed">{d.content}</p>
              </Card>
            ))}
            {docs.length === 0 && <div className="col-span-2 text-center py-12 border-2 border-dashed border-gray-200 rounded-2xl"><p className="text-gray-500 font-medium">Belum ada literatur untuk kelas ini.</p></div>}
          </div>
        </div>
      );
    }

    function UjiPemahamanView({ assignments, submissions, setSubmissions, profile, showToast }) {
      const myAsm = assignments.filter(a => a.grade === profile.grade);
      const [activeAsm, setActiveAsm] = useState(null);
      const [answer, setAnswer] = useState("");
      const [grading, setGrading] = useState(false);

      const submit = () => {
        if (answer.length < 10) return;
        setGrading(true);
        setTimeout(() => {
          const score = answer.length > 40 ? 95 : 65;
          const feedback = score > 80 ? "Sangat baik. Analisis sudah mencakup poin inti yang diminta." : "Jawaban kurang dielaborasi. Coba perhatikan kembali instruksinya.";
          const newSub = { assignmentId: activeAsm.id, studentName: profile.name, answer, score, feedback };
          const updated = [...submissions, newSub];
          setSubmissions(updated);
          localStorage.setItem("iqra-submissions", JSON.stringify(updated));
          setGrading(false); setActiveAsm(null); setAnswer("");
          showToast("Tugas berhasil dikumpulkan dan dinilai AI.");
        }, 2000);
      };

      return (
        <div className="p-6 md:p-10 max-w-4xl mx-auto space-y-6 pb-24">
          <div>
            <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Tugas LMS (Kuis)</h2>
            <p className="text-sm text-gray-500 font-medium mt-1">Uji pemahamanmu dan dapatkan evaluasi cerdas langsung dari AI.</p>
          </div>
          <div className="space-y-4">
            {myAsm.map(a => {
              const done = submissions.find(s => s.assignmentId === a.id && s.studentName === profile.name);
              return (
                <Card key={a.id} className={done ? "border-l-4 border-[#2E8B68] bg-[#E3F2EB]/30" : "border-l-4 border-[#D9A441]"}>
                  <div className="flex justify-between items-start mb-2">
                     <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-gray-100 text-gray-600">{a.subject}</span>
                     {done ? <span className="text-xs font-bold text-[#2E8B68] flex items-center gap-1"><Lucide.CheckCircle size={14}/> Selesai</span> : <span className="text-xs font-bold text-[#C58A25] flex items-center gap-1"><Lucide.Clock size={14}/> Aktif</span>}
                  </div>
                  <h3 className="font-bold text-[#17332D] text-lg mb-1">{a.title}</h3>
                  <p className="text-sm text-gray-700">{a.question}</p>
                  
                  {done ? (
                    <div className="mt-4 p-4 bg-white border border-[#2E8B68]/30 rounded-xl shadow-sm">
                      <div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-500 uppercase">Nilai Akhir AI</span><span className="font-display text-2xl font-bold text-[#2E8B68]">{done.score}</span></div>
                      <p className="text-sm text-[#17332D] bg-gray-50 p-3 rounded-lg italic border border-gray-100 mb-3">"{done.answer}"</p>
                      <p className="text-xs font-medium text-[#2E8B68] flex items-start gap-2"><Lucide.Brain size={14} className="shrink-0 mt-0.5"/> {done.feedback}</p>
                    </div>
                  ) : (
                    <button onClick={() => setActiveAsm(a)} className="mt-4 w-full py-2.5 bg-[#0F5C4D] text-white text-sm font-bold rounded-xl shadow-md hover:bg-[#177E6A] transition-colors">Kerjakan Kuis</button>
                  )}
                </Card>
              )
            })}
            {myAsm.length === 0 && <div className="text-center py-12 border-2 border-dashed border-gray-200 rounded-2xl"><p className="text-gray-500 font-medium">Hore! Belum ada tugas untuk saat ini.</p></div>}
          </div>

          {activeAsm && (
             <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#17332D]/60 backdrop-blur-sm">
               <div className="w-full max-w-xl bg-white rounded-2xl shadow-2xl rise-in flex flex-col max-h-[90vh]">
                 <div className="p-5 border-b border-gray-100 flex justify-between items-center bg-[#F8F7F2] rounded-t-2xl">
                   <h3 className="font-bold text-[#17332D]">Lembar Pengerjaan</h3>
                   <button onClick={() => !grading && setActiveAsm(null)} className="text-gray-400 hover:text-gray-600 bg-white p-1 rounded-full shadow-sm"><Lucide.X size={18}/></button>
                 </div>
                 <div className="p-6 overflow-y-auto flex-1">
                   <div className="p-4 bg-[#F8EAC5] border border-[#D9A441]/30 rounded-xl mb-4">
                     <p className="text-xs font-bold text-[#C58A25] mb-1 uppercase">Pertanyaan</p>
                     <p className="text-sm font-medium text-[#5a4313]">{activeAsm.question}</p>
                   </div>
                   <textarea rows={6} value={answer} onChange={e=>setAnswer(e.target.value)} disabled={grading} placeholder="Ketik jawaban esaimu secara mendetail..." className="w-full border-2 border-gray-200 rounded-xl p-4 text-sm outline-none focus:border-[#0F5C4D] resize-none"></textarea>
                 </div>
                 <div className="p-5 border-t border-gray-100 bg-white rounded-b-2xl">
                   <button onClick={submit} disabled={grading || answer.length < 10} className="w-full py-3.5 bg-[#0F5C4D] text-white rounded-xl font-bold text-sm shadow-md hover:bg-[#177E6A] disabled:opacity-50 transition-all flex justify-center items-center gap-2">
                     {grading ? <><Lucide.Loader2 size={16} className="animate-spin"/> AI Sedang Mengoreksi...</> : "Kumpulkan & Evaluasi Otomatis"}
                   </button>
                 </div>
               </div>
             </div>
          )}
        </div>
      );
    }

    function AyatRelevan() {
      const [keyword, setKeyword] = useState("");
      const [loading, setLoading] = useState(false);
      const [results, setResults] = useState(null); 
      const [error, setError] = useState("");

      const search = async () => {
        const q = keyword.trim();
        if (!q || loading) return;
        setLoading(true); setError(""); setResults(null);
        try {
          const searchRes = await fetch(`https://api.alquran.cloud/v1/search/${encodeURIComponent(q)}/all/id.indonesian`);
          const searchData = await searchRes.json();
          const matches = (searchData?.data?.matches || []).slice(0, 3);
          if (matches.length === 0) { setResults([]); return; }
          const detailed = await Promise.all(
            matches.map(async (m) => {
              try {
                const detailRes = await fetch(`https://api.alquran.cloud/v1/ayah/${m.number}/editions/quran-uthmani,id.indonesian`);
                const detailData = await detailRes.json();
                return {
                  surahNumber: m.surah.number, surahName: m.surah.name, surahNameEn: m.surah.englishName, ayahNumber: m.numberInSurah,
                  arabic: detailData?.data?.[0]?.text || "", translation: detailData?.data?.[1]?.text || m.text,
                };
              } catch { return null; }
            })
          );
          setResults(detailed.filter(Boolean));
        } catch (e) {
          setError("Pencarian ayat sedang mengalami kendala jaringan.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="p-6 md:p-10 max-w-3xl mx-auto space-y-6 pb-24">
          <div>
            <h2 className="font-display text-3xl font-bold text-[#0F5C4D]">Tafsir & Referensi</h2>
            <p className="text-sm text-gray-500 font-medium mt-1">Pencarian ayat tematik yang terhubung langsung dengan API Al-Qur'an terverifikasi.</p>
          </div>

          <div className="flex items-center gap-2 rounded-xl px-3 py-1.5 bg-white shadow-sm border border-gray-200 focus-within:border-[#0F5C4D] transition-colors">
            <Lucide.Search size={18} className="text-gray-400 ml-2" />
            <input
              value={keyword} onChange={(e) => setKeyword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && search()}
              placeholder="Cari tema (misal: Sabar)..." className="flex-1 py-2.5 px-2 text-sm outline-none bg-transparent"
            />
            <button onClick={search} disabled={loading} className="px-5 py-2.5 rounded-lg text-sm font-bold text-white transition-colors hover:bg-[#177E6A] disabled:opacity-50" style={{ background: C.emerald }}>
              {loading ? <Lucide.Loader2 size={16} className="animate-spin" /> : "Cari"}
            </button>
          </div>

          {error && <div className="p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100">{error}</div>}
          {results?.length === 0 && <div className="p-4 bg-gray-50 text-gray-600 rounded-xl text-sm border text-center font-medium">Tidak ditemukan ayat untuk kata kunci tersebut.</div>}
          
          <div className="space-y-6">
            {results?.map((r, i) => (
              <Card key={i} className="border-t-4" style={{ borderTopColor: C.gold }}>
                <div className="flex justify-between items-center mb-6">
                  <p className="text-xs font-bold uppercase tracking-widest" style={{ color: C.gold }}>QS. {r.surahName} ({r.surahNameEn}) : {r.ayahNumber}</p>
                </div>
                <p className="font-arabic text-3xl leading-loose text-right mb-6" dir="rtl" style={{ color: C.ink }}>{r.arabic}</p>
                <p className="text-sm leading-relaxed" style={{ color: C.inkSoft }}>"{r.translation}"</p>
                <div className="mt-4 pt-4 border-t border-gray-100 flex justify-between items-center text-xs">
                  <span className="text-gray-400">Terjemahan: Kemenag RI via API</span>
                  <a href={`https://quran.kemenag.go.id/surah/${r.surahNumber}`} target="_blank" rel="noreferrer" className="font-bold flex items-center gap-1 hover:underline" style={{ color: C.emeraldSecondary }}>
                    Kaji Tafsir Kemenag <Lucide.ExternalLink size={10} />
                  </a>
                </div>
              </Card>
            ))}
          </div>
        </div>
      );
    }

    /* ============================================================
       MAIN APP SHELL (State, Routing, Layout)
       ============================================================ */
    const NAVIGATION = {
      student: [
        { id: "dashboard", label: "Beranda", icon: "Home" },
        { id: "ask", label: "Ask IQRA'", icon: "Brain" },
        { id: "materiku", label: "Perpustakaan", icon: "BookOpen" },
        { id: "uji", label: "Tugas (LMS)", icon: "FileSignature" },
        { id: "ayat", label: "Referensi Ayat", icon: "BookMarked" },
      ],
      teacher: [
        { id: "overview", label: "Wawasan Kelas", icon: "BarChart3" },
        { id: "modul", label: "Kelola Modul AI", icon: "Upload" },
        { id: "tugas", label: "Kelola Tugas LMS", icon: "CheckSquare" },
        { id: "domain", label: "Domain Rujukan", icon: "Globe" },
        { id: "settings", label: "Sistem & Filosofi", icon: "Settings" },
      ]
    };

    function App() {
      const [profile, setProfile] = useState(null);
      const [view, setView] = useState("dashboard");
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [teacherModalOpen, setTeacherModalOpen] = useState(false);
      const [lmsUnlocked, setLmsUnlocked] = useState(false);
      const [toastMsg, setToastMsg] = useState("");
      
      const [trustedSources, setTrustedSources] = useState(() => { const s = localStorage.getItem("iqra-domains"); return s ? JSON.parse(s) : [{ id: "ts-1", domain: "kemdikdasmen.go.id", org: "Kemdikdasmen RI", active: true }]; });
      const [settings, setSettings] = useState(() => { const s = localStorage.getItem("iqra-settings"); return s ? JSON.parse(s) : DEFAULT_SETTINGS; });
      const [documents, setDocuments] = useState(() => { const d = localStorage.getItem("iqra-docs"); return d ? JSON.parse(d) : BASE_CORPUS; });
      const [assignments, setAssignments] = useState(() => { const a = localStorage.getItem("iqra-assignments"); return a ? JSON.parse(a) : []; });
      const [submissions, setSubmissions] = useState(() => { const s = localStorage.getItem("iqra-submissions"); return s ? JSON.parse(s) : []; });
      const [history, setHistory] = useState(() => { const h = localStorage.getItem("iqra-history"); return h ? JSON.parse(h) : []; });

      const showToast = useCallback((msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(""), 3000); }, []);

      useEffect(() => {
        const savedProfile = localStorage.getItem("iqra-profile");
        if (savedProfile) {
          const p = JSON.parse(savedProfile);
          setProfile(p);
          setView(p.role === "student" ? "dashboard" : "overview");
        }
      }, []);

      const handleNav = (id) => {
        if (profile.role === "student" && id === "uji" && !lmsUnlocked) {
          setView(id);
          setDrawerOpen(false);
          return;
        }
        setView(id);
        setDrawerOpen(false); // Menutup otomatis saat menu dipilih
      };

      const handleRoleChange = (newProfile) => {
        setProfile(newProfile);
        localStorage.setItem("iqra-profile", JSON.stringify(newProfile));
        setView(newProfile.role === "student" ? "dashboard" : "overview");
        setLmsUnlocked(false);
        setTeacherModalOpen(false);
        showToast(`Berhasil masuk sebagai ${newProfile.role === "student" ? "Siswa" : "Guru"}`);
      };

      if (!profile) {
        return (
          <div className="h-screen flex flex-col font-body bg-[#F8F7F2] overflow-hidden selection:bg-[#F8EAC5]">
            <FontsAndStyles />
            <StudentLoginModal onSelect={handleRoleChange} settings={settings} />
          </div>
        );
      }

      const navItems = NAVIGATION[profile.role];

      const renderView = () => {
        if (profile.role === "student") {
          switch(view) {
            case "dashboard": return <StudentDashboard profile={profile} history={history} settings={settings} setView={handleNav} />;
            case "ask": return <AskIqraView profile={profile} documents={documents} onNewExchange={(exc) => { const h = [...history, exc]; setHistory(h); localStorage.setItem("iqra-history", JSON.stringify(h)); }} />;
            case "materiku": return <MaterikuView documents={documents} profile={profile} />;
            case "ayat": return <AyatRelevan />;
            case "uji": return !lmsUnlocked ? <LmsAuthModal settings={settings} onSuccess={() => {setLmsUnlocked(true); showToast("Brankas Ujian Terbuka.");}} onClose={() => handleNav("dashboard")} /> : <UjiPemahamanView assignments={assignments} submissions={submissions} setSubmissions={setSubmissions} profile={profile} showToast={showToast} />;
            default: return <StudentDashboard profile={profile} history={history} settings={settings} setView={handleNav} />;
          }
        } else {
          switch(view) {
            case "overview": return <TeacherOverview assignments={assignments} documents={documents} history={history} />;
            case "modul": return <TeacherModulView documents={documents} setDocuments={setDocuments} showToast={showToast} />;
            case "tugas": return <TeacherTugasView assignments={assignments} setAssignments={setAssignments} submissions={submissions} showToast={showToast} />;
            case "domain": return <TeacherDomainView sources={trustedSources} setSources={setTrustedSources} showToast={showToast} />;
            case "settings": return <SystemSettingsView settings={settings} setSettings={setSettings} showToast={showToast} />;
            default: return <TeacherOverview assignments={assignments} documents={documents} history={history} />;
          }
        }
      };

      return (
        <div className="h-screen w-full flex font-body bg-[#F8F7F2] overflow-hidden selection:bg-[#F8EAC5]">
          <FontsAndStyles />
          <Toast message={toastMsg} />

          {/* Drawer Sidebar Overlay (Otomatis Tersembunyi) */}
          {drawerOpen && <div className="fixed inset-0 bg-[#17332D]/40 z-[60] backdrop-blur-sm transition-opacity" onClick={() => setDrawerOpen(false)} />}
          
          <aside className={`fixed inset-y-0 left-0 w-72 max-w-[80vw] bg-white border-r border-[#E5E9E7] shadow-2xl z-[70] transform transition-transform duration-300 ease-in-out flex flex-col ${drawerOpen ? "translate-x-0" : "-translate-x-full"}`}>
