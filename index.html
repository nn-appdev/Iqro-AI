            <div className="flex items-center justify-between px-6 py-8 border-b border-gray-100">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-xl bg-[#0F5C4D] flex items-center justify-center shadow-md">
                  <Lucide.Brain size={24} color="#FFF" />
                </div>
                <div>
                  <h1 className="font-display text-2xl font-bold text-[#17332D] leading-none">IQRA'</h1>
                  <p className="text-[10px] font-bold text-[#D9A441] uppercase tracking-widest mt-1.5">Navigasi {profile.role}</p>
                </div>
              </div>
              <button onClick={() => setDrawerOpen(false)} className="p-2 text-gray-400 bg-gray-50 rounded-full hover:bg-gray-100 transition-colors"><Lucide.X size={18}/></button>
            </div>
            
            <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto iqra-scroll">
              {navItems.map(n => {
                const Icon = Lucide[n.icon] || Lucide.Circle;
                const active = view === n.id;
                return (
                  <button key={n.id} onClick={() => handleNav(n.id)} className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${active ? "bg-[#DDF3ED] text-[#0F5C4D]" : "text-gray-500 hover:bg-gray-50 hover:text-gray-800"}`}>
                    <Icon size={18} strokeWidth={active ? 2.5 : 2} style={{ color: active ? C.emerald : C.inkFaint }}/> {n.label}
                  </button>
                );
              })}
            </nav>

            <div className="p-5 border-t border-gray-100 bg-gray-50/50">
              <div className="flex items-center gap-3 mb-4 px-2">
                <div className="w-10 h-10 rounded-full bg-[#17332D] text-white flex items-center justify-center font-bold">{profile.name.charAt(0)}</div>
                <div className="overflow-hidden">
                  <p className="text-sm font-bold text-[#17332D] truncate">{profile.name}</p>
                  <p className="text-[10px] font-bold uppercase tracking-wider text-gray-500">{profile.role === "student" ? `Siswa Fase C` : "Hak Akses Penuh"}</p>
                </div>
              </div>
              {profile.role === "student" ? (
                 <button onClick={() => { setTeacherModalOpen(true); setDrawerOpen(false); }} className="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-white border border-gray-200 text-xs font-bold text-[#17332D] hover:bg-gray-50 transition-colors shadow-sm">
                   <Lucide.ShieldCheck size={16} /> Akses Guru / Admin
                 </button>
              ) : (
                 <button onClick={() => { handleRoleChange({ role: "student", name: "Siswa Kelas 5", grade: 5 }); setDrawerOpen(false); }} className="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-white border border-gray-200 text-xs font-bold text-gray-600 hover:bg-gray-50 transition-colors shadow-sm">
                   <Lucide.LogOut size={14} /> Kembali ke Mode Siswa
                 </button>
              )}
            </div>
          </aside>

          {teacherModalOpen && <TeacherLoginModal onSelect={handleRoleChange} onClose={() => setTeacherModalOpen(false)} />}

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col h-full relative w-full overflow-hidden">
            {/* Header Global (Tombol Menu) */}
            <header className="glass-panel h-16 shrink-0 flex items-center px-4 z-20">
              <button onClick={() => setDrawerOpen(true)} className="p-2.5 rounded-xl bg-white border border-gray-200 shadow-sm text-[#17332D] hover:bg-gray-50 transition-colors flex items-center gap-2">
                <Lucide.Menu size={20} /> <span className="text-sm font-bold hidden sm:inline-block">Menu Navigasi</span>
              </button>
              <div className="ml-auto flex items-center gap-2 px-3 py-1.5 bg-[#DDF3ED] rounded-full border border-[#B8E1D5]">
                <span className="text-[11px] font-bold text-[#0F5C4D] uppercase tracking-wider">{profile.name}</span>
              </div>
            </header>

            <div className={`flex-1 relative w-full h-full ${view === "ask" ? "overflow-hidden" : "overflow-y-auto iqra-scroll"}`}>
              {/* Background Motif */}
              {view !== "ask" && <div className="fixed inset-0 pointer-events-none flex items-center justify-center opacity-[0.03] z-[-1]"><GeoMotif size={600} /></div>}
              {renderView()}
            </div>
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
